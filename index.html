<style>
  @font-face {
    font-family: "Cascadia Code";
    src: url("https://cdn.jsdelivr.net/gh/microsoft/cascadia-code@main/fonts/ttf/CascadiaCode.ttf") format("truetype");
    font-weight: normal; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Cascadia Code";
    src: url("https://cdn.jsdelivr.net/gh/microsoft/cascadia-code@main/fonts/ttf/CascadiaCode-Bold.ttf") format("truetype");
    font-weight: bold; font-style: normal; font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: "Cascadia Code", Consolas, Monaco, monospace;
    user-select: none;
  }
  canvas { display: block; touch-action: none; }
  #fileInputBg, #fileInputSq { display: none; }
  #fileLabelBg, #fileLabelSq {
    position: fixed; display: none; z-index: 100; cursor: pointer;
  }
  #hexInput {
    position: fixed; display: none; z-index: 200;
    font-size: 22px; font-family: "Cascadia Code", Consolas, monospace;
    padding: 8px 12px; border: 2px solid #5050a0; border-radius: 8px;
    background: #1a1a2a; color: #f0f0f0; outline: none;
    width: 200px; text-align: center;
  }
</style>

<label for="fileInputSq" id="fileLabelSq"></label>

<input type="text" id="hexInput" maxlength="7" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="#000000">

var currentDifficulty = "medium";
try {
  var savedDiff = localStorage.getItem("catchme_difficulty");
  if (savedDiff) {
    for (var di = 0; di < DIFFICULTIES.length; di++) {
      if (DIFFICULTIES[di].id === savedDiff) { currentDifficulty = savedDiff; break; }
    }
  }
} catch(e) {}

function getDifficulty() {
  for (var i = 0; i < DIFFICULTIES.length; i++) {
    if (DIFFICULTIES[i].id === currentDifficulty) return DIFFICULTIES[i];
  }
  return DIFFICULTIES[1];
}

function getModeById(id) {
  for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) return MODES[i];
  return MODES[0];
}

function getDifficultyLabel(modeId, diff) {
  if (modeId === "timed") return diff.timedSeconds + " сек";
  if (modeId === "sprint") return diff.sprintTarget + " целей";
  if (diff.id === "easy") return "медленнее, крупнее";
  if (diff.id === "medium") return "стандарт";
  if (diff.id === "hard") return "быстрее, мельче";

}

// ---------- РЕКОРДЫ ----------
function recordKey(mode, diff) { return "catchme_record_" + mode + "_" + diff; }
function loadRecord(mode, diff) {
  try {
    var v = localStorage.getItem(recordKey(mode, diff));
    if (v === null) return 0;
    return parseInt(v) || 0;
  } catch(e) { return 0; }
}
function saveRecord(mode, diff, value) {
  try { localStorage.setItem(recordKey(mode, diff), String(value)); } catch(e) {}
}

// ---------- СТАТИСТИКА ----------
function todayDateStr() {
  var d = new Date();
  var day = d.getDate();
  var month = d.getMonth() + 1;
  var year = d.getFullYear();
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  return pad(day) + "." + pad(month) + "." + year;
}

var statsTotal = { games: 0, hits: 0, misses: 0, bestStreak: 0, firstGame: "" };
var statsModes = {};
var statsToday = { date: "", games: 0, hits: 0, bestScore: 0, bestTime: 0 };

function loadStats() {
  try {
    var t = localStorage.getItem("catchme_stats_total");
    if (t) statsTotal = JSON.parse(t);
  } catch(e) {}

  try {
    var m = localStorage.getItem("catchme_stats_modes");
    if (m) statsModes = JSON.parse(m);
  } catch(e) {}

  try {
    var td = localStorage.getItem("catchme_stats_today");
    if (td) statsToday = JSON.parse(td);
  } catch(e) {}

  // сброс "сегодня" в полночь
  var today = todayDateStr();
  if (statsToday.date !== today) {
    statsToday = { date: today, games: 0, hits: 0, bestScore: 0, bestTime: 0 };
    saveStats();
  }
}

function saveStats() {
  try { localStorage.setItem("catchme_stats_total", JSON.stringify(statsTotal)); } catch(e) {}
  try { localStorage.setItem("catchme_stats_modes", JSON.stringify(statsModes)); } catch(e) {}
  try { localStorage.setItem("catchme_stats_today", JSON.stringify(statsToday)); } catch(e) {}
}

function getModeStats(modeId) {
  if (!statsModes[modeId]) {
    statsModes[modeId] = { games: 0, hits: 0, misses: 0, bestScore: 0, bestTime: 0 };
  }
  return statsModes[modeId];
}

function resetStatsAll() {
  statsTotal = { games: 0, hits: 0, misses: 0, bestStreak: 0, firstGame: "" };
  statsModes = {};
  statsToday = { date: todayDateStr(), games: 0, hits: 0, bestScore: 0, bestTime: 0 };

// Записать результаты одной игры
// mode: id, score: итоговый счёт, hits: попаданий, misses: промахов,
// bestStreak: лучшая серия попаданий подряд за игру,
// elapsedTime: для спринта (секунды)
function recordGameEnd(mode, score, hits, misses, bestStreak, elapsedTime) {
  // тотал
  statsTotal.games++;
  statsTotal.hits += hits;
  statsTotal.misses += misses;
  if (bestStreak > statsTotal.bestStreak) statsTotal.bestStreak = bestStreak;
  if (!statsTotal.firstGame) statsTotal.firstGame = todayDateStr();

  // по режиму
  var m = getModeStats(mode);
  m.games++;
  m.hits += hits;
  m.misses += misses;
  if (mode === "sprint") {
    if (m.bestTime === 0 || elapsedTime < m.bestTime) m.bestTime = elapsedTime;
  } else {
    if (score > m.bestScore) m.bestScore = score;
  }

  // сегодня
  var today = todayDateStr();
  if (statsToday.date !== today) {
    statsToday = { date: today, games: 0, hits: 0, bestScore: 0, bestTime: 0 };
  }
  statsToday.games++;
  statsToday.hits += hits;
  if (mode === "sprint") {
    if (statsToday.bestTime === 0 || elapsedTime < statsToday.bestTime) {
      statsToday.bestTime = elapsedTime;
    }
  } else {
    if (score > statsToday.bestScore) statsToday.bestScore = score;
  }

  saveStats();
}

var achievementsEarned = {};

  if (ae) achievementsEarned = JSON.parse(ae);
} catch(e) {}

// плашка
var achievementQueue = [];
var achievementToast = null;

function giveAchievement(id) {
  if (achievementsEarned[id]) return;
  achievementsEarned[id] = Date.now();
  saveAchievements();

  // найти объект
  for (var i = 0; i < ACHIEVEMENTS_LIST.length; i++) {
    if (ACHIEVEMENTS_LIST[i].id === id) {
      achievementQueue.push(ACHIEVEMENTS_LIST[i]);
      break;
    }
  }
  soundAchievement();
}

function checkAchievements(ctx) {
  for (var i = 0; i < ACHIEVEMENTS_LIST.length; i++) {
    var a = ACHIEVEMENTS_LIST[i];
    if (!achievementsEarned[a.id] && a.check && a.check(ctx)) {
      giveAchievement(a.id);
    }
  }
}

function popNextToastIfNeeded() {
  if (achievementToast) return;
  if (achievementQueue.length === 0) return;
  var a = achievementQueue.shift();
  achievementToast = {
    ach: a,
    inTime: 0,
    holdTime: 0,
    outTime: 0,
    phase: "in" // "in" | "hold" | "out"
  };
}

function updateToast(dt) {
  popNextToastIfNeeded();
  if (!achievementToast) return;
  var t = achievementToast;
  if (t.phase === "in") {
    t.inTime += dt;
    if (t.inTime >= 0.4) { t.phase = "hold"; t.holdTime = 0; }
  } else if (t.phase === "hold") {
    t.holdTime += dt;
    if (t.holdTime >= 2.5) { t.phase = "out"; t.outTime = 0; }
  } else if (t.phase === "out") {
    t.outTime += dt;
    if (t.outTime >= 0.4) { achievementToast = null; }
  }
}

function drawToast() {
  if (!achievementToast) return;
  var t = achievementToast;
  var toastW = 280, toastH = 72;
  var targetX = W - toastW - 20;
  var targetY = H - toastH - 20;

  var x = targetX, y = targetY;
  if (t.phase === "in") {
    var p = t.inTime / 0.4;
    if (p > 1) p = 1;
    x = W + (targetX - W) * p;
  } else if (t.phase === "out") {
    var p2 = t.outTime / 0.4;
    if (p2 > 1) p2 = 1;
    x = targetX + (W - targetX) * p2;
  }

  ctx.save();
  ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
  ctx.shadowBlur = 12;
  ctx.shadowOffsetX = 3;
  ctx.shadowOffsetY = 4;

function playTone(freq, duration, type, volumeScale, freqEnd) {
  if (!soundEnabled) return;

    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd !== undefined) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), now + duration);
    }
    var peak = fxVolume * (volumeScale || 1) * 0.3;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  } catch(e) {}
}

function playMusicNote() {
  if (!audioCtx || !soundEnabled || musicVolume <= 0) return;
  if (musicMode === "silent") return;
  var melody = getCurrentMelody();
  var bassLine = getCurrentBass();
  var now = audioCtx.currentTime;
  var idx = musicStep % melody.length;

  var f = melody[idx];
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(f, now);
    var peak = musicVolume * 0.07;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.20);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.22);
  } catch(e) {}

  if (idx % 4 === 0 && musicMode !== "gameover") {
    try {
      var oscC = audioCtx.createOscillator();
      var gainC = audioCtx.createGain();
      oscC.type = "square";
      oscC.frequency.setValueAtTime(f * 1.25, now);
      var peakC = musicVolume * 0.04;
      gainC.gain.setValueAtTime(0.0001, now);
      gainC.gain.exponentialRampToValueAtTime(peakC, now + 0.01);
      gainC.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      oscC.connect(gainC); gainC.connect(audioCtx.destination);
      oscC.start(now); oscC.stop(now + 0.24);
    } catch(e) {}
  }

  if (idx % 2 === 0) {
    var bassF = bassLine[Math.floor(idx / 2) % bassLine.length];
    try {
      var oscB = audioCtx.createOscillator();
      var gainB = audioCtx.createGain();
      oscB.type = "triangle";
      oscB.frequency.setValueAtTime(bassF, now);
      var peakB = musicVolume * 0.11;
      gainB.gain.setValueAtTime(0.0001, now);
      gainB.gain.exponentialRampToValueAtTime(peakB, now + 0.01);
      gainB.gain.exponentialRampToValueAtTime(0.0001, now + 0.40);
      oscB.connect(gainB); gainB.connect(audioCtx.destination);
      oscB.start(now); oscB.stop(now + 0.42);
    } catch(e) {}
  }

  musicStep++;
  if (musicStep >= melody.length) {
    musicStep = 0;
    onMelodyEnd();
  }
}

function onMelodyEnd() {

function startMusic() {
  if (musicPlaying) return;
  if (!audioReady) initAudio();
  if (!audioCtx) return;
  if (!soundEnabled || musicVolume <= 0) return;
  if (musicMode === "silent") return;
  musicPlaying = true;
  musicStep = 0;
  playMusicNote();
  musicTimer = setInterval(playMusicNote, MELODY_TEMPO);
}

function stopMusic() {
  if (!musicPlaying) return;
  musicPlaying = false;
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

  musicMode = mode;

function darkenColor(hex, factor) {

  var g = Math.round(rgb[1] * (1 - factor));
  var b = Math.round(rgb[2] * (1 - factor));
  return rgbToHex(r, g, b);
}

function hsvToRgb(h, s, v) {
  var c = v * s;
  var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  var m = v - c;
  var r = 0, g = 0, b = 0;
  if (h < 60)       { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rgbToHex(r, g, b) {
  function h(x) { var s = x.toString(16); return s.length === 1 ? "0" + s : s; }
  return "#" + h(r) + h(g) + h(b);
}
function hexToRgb(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  if (hex.length !== 6) return null;
  var num = parseInt(hex, 16);
  if (isNaN(num)) return null;
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function initPickerFromColorObj(picker, hex) {
  if (!hex) return;
  var rgb = hexToRgb(hex);
  if (!rgb) return;
  var r = rgb[0]/255, g = rgb[1]/255, b = rgb[2]/255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var d = max - min, h = 0;
  if (d !== 0) {
    if (max === r) h = 60 * (((g-b)/d) % 6);
    else if (max === g) h = 60 * ((b-r)/d + 2);
    else h = 60 * ((r-g)/d + 4);
  }
  if (h < 0) h += 360;
  picker.hue = h;
  picker.sat = max === 0 ? 0 : d/max;
  picker.val = max;
}

function openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open("catchme_db", 2);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains("bg")) db.createObjectStore("bg");
      if (!db.objectStoreNames.contains("square")) db.createObjectStore("square");
    };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}
function saveToStore(s, blob) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(s, "readwrite");
      tx.objectStore(s).put(blob, "image");
      tx.oncomplete = function() { res(); };
      tx.onerror = function(e) { rej(e.target.error); };
    });
  });
}
function loadFromStore(s) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(s, "readonly");
      var req = tx.objectStore(s).get("image");
      req.onsuccess = function() { res(req.result || null); };
      req.onerror = function(e) { rej(e.target.error); };
    });
  });
}
function deleteFromStore(s) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(s, "readwrite");
      tx.objectStore(s).delete("image");
      tx.oncomplete = function() { res(); };
      tx.onerror = function(e) { rej(e.target.error); };
    });
  });
}

var hexInput = document.getElementById("hexInput");
var hexInputVisible = false;
var hexTarget = "bg";

function showHexInput(x,y,w,h,currentHex,target) {
  hexInput.style.display = "block";
  hexInput.style.left = x+"px"; hexInput.style.top = y+"px";
  hexInput.style.width = w+"px"; hexInput.style.height = h+"px";
  hexInput.value = currentHex || "#000000";
  hexInputVisible = true; hexTarget = target || "bg";
}
function hideHexInput() {
  hexInput.style.display = "none";
  hexInputVisible = false;
  hexInput.blur();
}
function applyHexInput() {
  var val = hexInput.value.trim();
  if (val.length > 0 && val[0] !== "#") val = "#" + val;
  var rgb = hexToRgb(val);
  if (rgb) {
    var hex = rgbToHex(rgb[0], rgb[1], rgb[2]);
    if (hexTarget === "square") {
      pickSquareColor(hex);
      initPickerFromColorObj(squarePicker, hex);
    } else {
      pickBgColor(hex);
      initPickerFromColorObj(picker, hex);
    }
  }
  hexTarget = "bg";
  hideHexInput();
}
hexInput.addEventListener("blur", function() { if (hexInputVisible) applyHexInput(); });
hexInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") { e.preventDefault(); applyHexInput(); }
});

function overlapsExitZone(x, y, size) {
  // Зона кнопки "✕" — фиксированная, с большим запасом
  var EXIT_SIZE = 48;
  var EXIT_PAD = 16;
  var ebX = W - EXIT_SIZE - EXIT_PAD;
  var ebY = EXIT_PAD;
  var ebW = EXIT_SIZE;
  var ebH = EXIT_SIZE;

  // Дополнительный отступ вокруг зоны — квадратик не должен подходить вплотную
  var SAFE_PAD = 20;

  var half = size / 2;
  var l = x - half;
  var r = x + half;
  var t = y - half;
  var b = y + half;

  // Проверяем пересечение прямоугольников с учётом SAFE_PAD
  var zoneL = ebX - SAFE_PAD;
  var zoneR = ebX + ebW + SAFE_PAD;
  var zoneT = ebY - SAFE_PAD;
  var zoneB = ebY + ebH + SAFE_PAD;

  return !(r < zoneL || l > zoneR || b < zoneT || t > zoneB);
}

var currentSignature = "";
var signatureShownOnState = "";
var signatureScrollX = 0;
var signatureScrolling = false;
var signatureWidth = 0;
var signaturePauseTimer = 0;
var signaturePhase = "idle"; // idle | pause | scroll | enter

function pickSignature() {
  if (SIGNATURES.length === 0) return "";
  var nonEmpty = [];
  for (var i = 0; i < SIGNATURES.length; i++) {
    if (SIGNATURES[i] && SIGNATURES[i].length > 0) nonEmpty.push(SIGNATURES[i]);
  }
  if (nonEmpty.length === 0) return "";
  return nonEmpty[Math.floor(Math.random() * nonEmpty.length)];
}

function updateSignatureForState() {
  var allowed = [
    MENU, MODE_SELECT, MODE_INFO,
    SETTINGS, STATS, ACHIEVEMENTS
  ];
  var isAllowed = false;
  for (var i = 0; i < allowed.length; i++) {
    if (allowed[i] === game.state) { isAllowed = true; break; }
  }
  if (!isAllowed) return;

  if (signatureShownOnState !== game.state) {
    currentSignature = pickSignature();
    signatureShownOnState = game.state;
    signatureScrollX = 0;
    signatureScrolling = false;
    signaturePauseTimer = 0;
    signaturePhase = "idle"; // idle | pause | scroll

    if (currentSignature) {
      ctx.save();
      ctx.font = "bold 17px " + FONT_FAMILY;
      signatureWidth = ctx.measureText(currentSignature).width;
      ctx.restore();
      var availableW = W - 28;
      if (signatureWidth > availableW) {
        signatureScrolling = true;
        signatureScrollX = 14;
        signaturePhase = "pause"; // сначала пауза
        signaturePauseTimer = 2.5; // 2.5 секунды стоим
      }
    }
  }
}

function updateSignatureScroll(dt) {
  if (!signatureScrolling) return;

  if (signaturePhase === "pause") {
    // стоим на месте
    signaturePauseTimer -= dt;
    if (signaturePauseTimer <= 0) {
      signaturePhase = "scroll";
    }
    return;
  }

  if (signaturePhase === "scroll") {
    signatureScrollX -= 50 * dt;

    // полностью ушла влево — начинаем цикл сначала
    if (signatureScrollX + signatureWidth < -20) {
      // появляемся справа за экраном
      signatureScrollX = W + 20;
      signaturePhase = "enter";
    }
    return;
  }

  if (signaturePhase === "enter") {
    // едем влево до угла (14px)
    var targetX = 14;
    var speed = 80 * dt;
    if (signatureScrollX - speed <= targetX) {
      signatureScrollX = targetX;
      signaturePhase = "pause";
      signaturePauseTimer = 2.5; // стоим 2.5 сек
    } else {
      signatureScrollX -= speed;
    }
    return;
  }
}

function drawSignature() {
  if (!currentSignature || currentSignature.length === 0) return;

  ctx.save();
  ctx.font = "bold 17px " + FONT_FAMILY;
  ctx.textAlign = "left";
  ctx.textBaseline = "bottom";
  ctx.fillStyle = "rgba(255, 255, 255, 0.5)";

  if (!signatureScrolling) {
    // влезает — рисуем на месте
    ctx.fillText(currentSignature, 14, H - 12);
  } else {
    // не влезает — обрезаем область и рисуем бегущую строку
    ctx.beginPath();
    ctx.rect(0, H - 30, W, 28);
    ctx.clip();
    ctx.fillText(currentSignature, signatureScrollX, H - 12);
  }

  ctx.restore();
}

// ---------- ЛЕТАЮЩИЕ КВАДРАТИКИ В МЕНЮ ----------
var menuSquares = [];
var menuSquareSpawnTimer = 0;
var menuTrails = []; // следы за квадратиками

function spawnMenuSquare() {
  // появляется из-за края экрана
  var side = Math.floor(Math.random() * 4); // 0=верх, 1=право, 2=низ, 3=лево
  var x, y, vx, vy;
  var speed = 40 + Math.random() * 90; // пиксели в секунду

  // размер — два класса: маленькие и крупные, без середины
  var size;
  if (Math.random() < 0.5) {
    size = 5 + Math.random() * 7;   // 5–12, маленькие
  } else {
    size = 14 + Math.random() * 11; // 14–25, крупные
  }

  if (side === 0) {
    x = Math.random() * W;
    y = -size;
    var ang = Math.random() * Math.PI * 2;
    vx = Math.cos(ang) * speed;
    vy = Math.abs(Math.sin(ang) * speed);
  } else if (side === 1) {
    x = W + size;
    y = Math.random() * H;
    var ang2 = Math.random() * Math.PI * 2;
    vx = -Math.abs(Math.cos(ang2) * speed);
    vy = Math.sin(ang2) * speed;
  } else if (side === 2) {
    x = Math.random() * W;
    y = H + size;
    var ang3 = Math.random() * Math.PI * 2;
    vx = Math.cos(ang3) * speed;
    vy = -Math.abs(Math.sin(ang3) * speed);
  } else {
    x = -size;
    y = Math.random() * H;
    var ang4 = Math.random() * Math.PI * 2;
    vx = Math.abs(Math.cos(ang4) * speed);
    vy = Math.sin(ang4) * speed;
  }

  menuSquares.push({
    x: x, y: y,
    vx: vx, vy: vy,
    size: size,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    popPhase: "none",
    popTime: 0,
    dead: false,
    trailTimer: 0
  });
}

function updateMenuSquares(dt) {
  // спавн — не больше 8 одновременно
  if (game.state === MENU && menuSquares.length < 25) {
    menuSquareSpawnTimer -= dt;
    if (menuSquareSpawnTimer <= 0) {
      spawnMenuSquare();
      menuSquareSpawnTimer = 0.5 + Math.random() * 1.5;
    }
  }

  // обновляем следы — уменьшаем жизнь, убираем мёртвые
  for (var t = menuTrails.length - 1; t >= 0; t--) {
    var tr = menuTrails[t];
    tr.life -= dt;
    if (tr.life <= 0) menuTrails.splice(t, 1);
  }
  
  var mx = game.mouse.x, my = game.mouse.y;

  for (var i = menuSquares.length - 1; i >= 0; i--) {
    var sq = menuSquares[i];

    // анимация распада
    if (sq.popPhase !== "none") {
      sq.popTime += dt;
      if (sq.popPhase === "in") {
        if (sq.popTime >= 0.08) {
          sq.popPhase = "out";
          sq.popTime = 0;
          spawnParticles(sq.x, sq.y, sq.size, sq.color, false);
          spawnMenuPopup(sq.x, sq.y);
        }
      } else if (sq.popPhase === "out") {
        if (sq.popTime >= 0.12) {
          menuSquares.splice(i, 1);
        }
      }
      continue;
    }

    // создаём след — раз в 0.05 сек
    sq.trailTimer -= dt;
    if (sq.trailTimer <= 0) {
      sq.trailTimer = 0.05;
      menuTrails.push({
        x: sq.x,
        y: sq.y,
        size: sq.size * 0.7,
        color: sq.color,
        life: 0.4,
        maxLife: 0.4
      });
    }

    // убегание от курсора — только когда активно меню
    if (game.state === MENU) {
      var dx = sq.x - mx;
      var dy = sq.y - my;
      var dist = Math.sqrt(dx*dx + dy*dy) || 1;
      if (dist < 150) {
        var force = (150 - dist) / 150 * 60;
        sq.vx += (dx / dist) * force * dt;
        sq.vy += (dy / dist) * force * dt;
      }
    }

    // ограничение скорости — максимум как на средней сложности
    // базовая скорость в игре 1.2, множитель 1.0. То есть 1.2 пикс/кадр = 72 пикс/сек
    // но меню квадраты могут быть быстрее, ограничим ~120 пикс/сек
    var sp = Math.sqrt(sq.vx*sq.vx + sq.vy*sq.vy);
    var maxSpeed = 120;
    if (sp > maxSpeed) {
      sq.vx = (sq.vx / sp) * maxSpeed;
      sq.vy = (sq.vy / sp) * maxSpeed;
    }

    sq.x += sq.vx * dt;
    sq.y += sq.vy * dt;

    // улетел за экран — удаляем
    if (sq.x < -60 || sq.x > W + 60 || sq.y < -60 || sq.y > H + 60) {
      menuSquares.splice(i, 1);
    }
  }
}

  // сначала следы (под квадратиками)
  for (var t = 0; t < menuTrails.length; t++) {
    var tr = menuTrails[t];
    var trailAlpha = (tr.life / tr.maxLife) * 0.4;
    ctx.globalAlpha = trailAlpha;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(tr.x - tr.size/2, tr.y - tr.size/2, tr.size, tr.size);
  }

  // потом сами квадратики
  for (var i = 0; i < menuSquares.length; i++) {
    var sq = menuSquares[i];
    var size = sq.size;
    var alpha = 1;

    if (sq.popPhase === "in") {
      var p = sq.popTime / 0.08;
      size = sq.size * (1 + 0.5 * p);
    } else if (sq.popPhase === "out") {
      var p2 = sq.popTime / 0.12;
      size = sq.size * 1.5 * (1 - p2);
      alpha = 1 - p2;
    }

    if (size <= 0) continue;

    ctx.globalAlpha = alpha;
    ctx.fillStyle = sq.color;
    ctx.fillRect(sq.x - size/2, sq.y - size/2, size, size);
  }
  ctx.globalAlpha = 1;
}

function menuSquareClick(px, py) {
  if (game.state !== MENU) return false;
  for (var i = menuSquares.length - 1; i >= 0; i--) {
    var sq = menuSquares[i];
    if (sq.popPhase !== "none") continue;
    if (Math.abs(px - sq.x) < sq.size/2 && Math.abs(py - sq.y) < sq.size/2) {
      sq.popPhase = "in";
      sq.popTime = 0;
      sq.dead = true;
      // звук — как soundHit, но тише на 50%
      playTone(700, 0.08, "square", 0.4);
      return true;
    }
  }
  return false;
}

// ---------- "«:р»" при клике на мини-квадратик ----------
var menuPopups = [];
function spawnMenuPopup(x, y) {
  menuPopups.push({ x: x, y: y, life: 0.8, maxLife: 0.8 });
}
function updateMenuPopups(dt) {
  for (var i = menuPopups.length - 1; i >= 0; i--) {
    var p = menuPopups[i];
    p.y -= 60 * dt;
    p.life -= dt;
    if (p.life <= 0) menuPopups.splice(i, 1);
  }
}
function drawMenuPopups() {
  for (var i = 0; i < menuPopups.length; i++) {
    var p = menuPopups[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 24px " + FONT_FAMILY;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(":р", p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function spawnParticles(x, y, baseSize, color, useImage) {
  var count = 16;
  for (var i = 0; i < count; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 100 + Math.random() * 200;
    var size = 3 + Math.random() * 4;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.6, maxLife: 0.6,
      size: size, color: color,
      useImage: useImage,
      srcX: Math.random(), srcY: Math.random(),
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 6
    });
  }
}
function updateParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.rotation += p.rotSpeed * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    var hs = p.size / 2;
    if (p.useImage && sqImage) {
      var imgW = sqImage.width;
      var imgH = sqImage.height;
      var side = Math.min(imgW, imgH);
      var cropX = p.srcX * (imgW - side);
      var cropY = p.srcY * (imgH - side);
      ctx.drawImage(sqImage, cropX, cropY, side, side, -hs, -hs, p.size, p.size);
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(-hs, -hs, p.size, p.size);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------- КВАДРАТИК ----------
function Square() {
  var d = getDifficulty();
  this.baseSize = d.sizeStart;
    // генерируем позицию — гарантированно вне зоны кнопки "✕"
  var maxAttempts = 50;
  var posX, posY;
  do {
    posX = Math.random() * (W - 100) + 50;
    posY = Math.random() * (H - 100) + 50;
    maxAttempts--;
  } while (maxAttempts > 0 && overlapsExitZone(posX, posY, d.sizeStart));

  this.x = posX;
  this.y = posY;
  if (squareMode === "color" && squareColor) {
    this.color = squareColor;
  } else {
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
  }
  this.speed = 2.0;
  this.behavior = "run";
  this.huntTimer = 0;
  this.fake = false;
  this.teleportCooldown = 0;
  this.boostTimer = BOOST_INTERVAL;
  this.boostActive = 0;
  this.disguiseTimer = 60;
  this.popPhase = "none";
  this.popTime = 0;
  this.spawnTime = 0;
  this.missPhase = "none";
  this.missTime = 0;
  this.dead = false;
  this.removed = false;
}

Square.prototype.startPop = function() { this.popPhase = "in"; this.popTime = 0; this.dead = true; };
Square.prototype.startMiss = function() { this.missPhase = "blink"; this.missTime = 0; this.dead = true; };

Square.prototype.update = function(mx, my, score, dt) {
  if (!dt) dt = 1/60;
  var d = getDifficulty();

  if (this.popPhase !== "none") {
    this.popTime += dt;
    if (this.popPhase === "in") {
      if (this.popTime >= POP_DURATION_IN) {
        this.popPhase = "out"; this.popTime = 0;
        spawnParticles(this.x, this.y, this.baseSize, this.color, !!(sqImage && !this.fake));
      }
    } else if (this.popPhase === "out") {
      if (this.popTime >= POP_DURATION_OUT) {
        this.popPhase = "none"; this.removed = true;
      }
    }
    return;
  }
  if (this.missPhase !== "none") {
    this.missTime += dt;
    if (this.missPhase === "blink") {
      if (this.missTime >= MISS_BLINK_DURATION) { this.missPhase = "fade"; this.missTime = 0; }
    } else if (this.missPhase === "fade") {
      if (this.missTime >= MISS_FADE_DURATION) { this.missPhase = "none"; this.removed = true; }
    }
    return;
  }
  if (this.spawnTime < SPAWN_DURATION) this.spawnTime += dt;

  var current = LEVELS[0];
  for (var i = 0; i < LEVELS.length; i++) {
    if (score >= LEVELS[i].score) current = LEVELS[i];
  }
  this.speed = current.speed * d.speedMul;
  this.behavior = this.fake ? "run" : current.behavior;
  
  this.baseSize = Math.max(d.sizeMin, d.sizeStart - score * d.sizeStep);
  
  if (this.teleportCooldown > 0) this.teleportCooldown -= dt;

  var boostFactor = 1.0;
  if (this.behavior === "boost") {
    this.boostTimer -= dt;
    if (this.boostTimer <= 0 && this.boostActive <= 0) {
      this.boostActive = d.boostDuration;
      this.boostTimer = BOOST_INTERVAL;
      if (!this.fake) soundBoost();
    }
    if (this.boostActive > 0) { this.boostActive -= dt; boostFactor = d.boostMultiplier; }
  }

  var dx = this.x - mx, dy = this.y - my;
  var dist = Math.sqrt(dx*dx + dy*dy) || 1;
  dx /= dist; dy /= dist;
  var moveX = 0, moveY = 0;

  if (this.behavior === "run" || this.behavior === "boost" ||
      this.behavior === "disguise" || this.behavior === "multiply" ||
      this.behavior === "teleport") {
    moveX = dx * this.speed * boostFactor;
    moveY = dy * this.speed * boostFactor;
    if (this.behavior === "teleport" && this.teleportCooldown <= 0 && dist < TELEPORT_RADIUS) {
      var newX, newY, attempts = 0;
      do {
        newX = Math.random() * (W - 100) + 50;
        newY = Math.random() * (H - 100) + 50;
        attempts++;
      } while (attempts < 20 &&
        (Math.sqrt((newX-mx)*(newX-mx)+(newY-my)*(newY-my)) < TELEPORT_MIN_DIST ||
         overlapsExitZone(newX, newY, this.baseSize)));
      this.x = newX; this.y = newY;
      this.teleportCooldown = TELEPORT_COOLDOWN;
      if (!this.fake) soundTeleport();
      return;
    }
        if (this.behavior === "disguise") {
      this.disguiseTimer--;
      if (this.disguiseTimer <= 0) {
        if (squareMode === "random") {
          this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }
        this.disguiseTimer = 60;
      }
    }
  } else if (this.behavior === "hunt") {
    this.huntTimer--;
    if (this.huntTimer <= 0) {
      moveX = -dx * this.speed * 1.5; moveY = -dy * this.speed * 1.5;
      this.huntTimer = 90;
    } else {
      moveX = dx * this.speed * 0.5; moveY = dy * this.speed * 0.5;
    }
  }

  var newX2 = this.x + moveX;
  var newY2 = this.y + moveY;
  if (overlapsExitZone(newX2, newY2, this.baseSize)) {
    if (!overlapsExitZone(newX2, this.y, this.baseSize)) { newY2 = this.y; }
    else if (!overlapsExitZone(this.x, newY2, this.baseSize)) { newX2 = this.x; }
    else { newX2 = this.x; newY2 = this.y; }
  }
  this.x = newX2; this.y = newY2;
  this.x = Math.max(this.baseSize, Math.min(W - this.baseSize, this.x));
  this.y = Math.max(this.baseSize, Math.min(H - this.baseSize, this.y));
};

Square.prototype.getCurrentSize = function() {
  var s = this.baseSize;
  if (this.spawnTime < SPAWN_DURATION) {
    var t = this.spawnTime / SPAWN_DURATION;
    s = this.baseSize * t;
  }
  if (this.popPhase === "in") {
    var t1 = this.popTime / POP_DURATION_IN;
    s = this.baseSize * (1 + (POP_SCALE_MAX - 1) * t1);
  } else if (this.popPhase === "out") {
    var t2 = this.popTime / POP_DURATION_OUT;
    s = this.baseSize * POP_SCALE_MAX * (1 - t2);
  }
  return Math.max(0, s);
};
Square.prototype.getAlpha = function() {
  if (this.missPhase === "fade") {
    var t = this.missTime / MISS_FADE_DURATION;
    return Math.max(0, 1 - t);
  }
  return 1;
};
Square.prototype.getRedFlash = function() {
  if (this.missPhase === "blink") {
    var t = this.missTime / MISS_BLINK_DURATION;
    var val = Math.sin(t * Math.PI * 2 * 2);
    return Math.max(0, val) * 0.15;
  }
  return 0;
};
Square.prototype.collides = function(mx, my) {
  var s = this.getCurrentSize();
  return Math.abs(mx - this.x) < s/2 && Math.abs(my - this.y) < s/2;
};
Square.prototype.draw = function() {
  var size = this.getCurrentSize();
  if (size <= 0) return;
  var alpha = this.getAlpha();
  var redFlash = this.getRedFlash();
  ctx.globalAlpha = alpha;
  var half = size / 2;
  var x = this.x - half;
  var y = this.y - half;
  var PAD = 3;
  var padX = x - PAD, padY = y - PAD, padSize = size + PAD * 2;

  if (!this.fake) {
    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 4;
    if (squareMode === "image" && sqImage) {
      ctx.drawImage(sqImage, padX, padY, padSize, padSize);
    } else {
      var darkColor = darkenColor(this.color, 0.25);
      ctx.fillStyle = darkColor;
      ctx.fillRect(padX, padY, padSize, padSize);
    }
    ctx.restore();
  }

  var useImage = (squareMode === "image" && sqImage);

  if (useImage) {
    ctx.drawImage(sqImage, padX, padY, padSize, padSize);
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.fillRect(padX, padY, padSize, padSize);
  } else {
    var darkColor2 = darkenColor(this.color, 0.25);
    ctx.fillStyle = darkColor2;
    ctx.fillRect(padX, padY, padSize, padSize);
  }

  if (useImage) {
    ctx.drawImage(sqImage, x, y, size, size);
  } else {
    ctx.fillStyle = this.color;
    ctx.fillRect(x, y, size, size);
  }

  if (redFlash > 0) {
    ctx.fillStyle = "rgba(255, 0, 0, " + redFlash + ")";
    ctx.fillRect(x, y, size, size);
  }
  ctx.globalAlpha = 1;
};

var popups = [];
function spawnPopup(x, y) { popups.push({ x: x, y: y, life: 0.8, maxLife: 0.8 }); }
function updatePopups(dt) {
  for (var i = popups.length - 1; i >= 0; i--) {
    var p = popups[i];
    p.y -= 60 * dt; p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
}
function drawPopups() {
  for (var i = 0; i < popups.length; i++) {
    var p = popups[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px " + FONT_FAMILY;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("+1", p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

            this.finishSprint();
          }
        }
        return;
      }

      for (var fi2 = this.fakeSquares.length - 1; fi2 >= 0; fi2--) {
        var fsq = this.fakeSquares[fi2];
        if (!fsq.dead && fsq.collides(px, py)) {
          soundMissClick();
          fsq.startMiss();
          this.deadSquares.push(fsq);
          this.fakeSquares.splice(fi2, 1);
          if (this.mode === "accuracy") {
            this.score--;
            this.missesThisGame++;
            this.currentStreak = 0;
          }
          return;
        }
      }

      if (this.mode === "accuracy") {
        var hitDead = false;
        for (var di = 0; di < this.deadSquares.length; di++) {
          if (this.deadSquares[di].collides(px, py)) { hitDead = true; break; }
        }
        if (!hitDead) {
          soundMissClick();
          this.score--;
          this.missesThisGame++;
          this.currentStreak = 0;
        }
      }
      return;
    }

    if (this.state === GAME_OVER) {
      if (this.gameOverTime < GAMEOVER_FADE_DURATION) return;
      for (var j = 0; j < this.buttons.length; j++) {
        var b2 = this.buttons[j];
        if (px >= b2.x && px <= b2.x + b2.w && py >= b2.y && py <= b2.y + b2.h) {
          soundClick();
          if (b2.id === "again") this.start(this.mode);
          if (b2.id === "menu") { this.state = MENU; setMusicMode("menu"); }
          return;
        }
      }
      return;
    }

    if (this.state === ENDLESS_QUIT) {
      if (this.gameOverTime < GAMEOVER_FADE_DURATION) return;
      for (var ek = 0; ek < this.buttons.length; ek++) {
        var eb2 = this.buttons[ek];
        if (px >= eb2.x && px <= eb2.x + eb2.w && py >= eb2.y && py <= eb2.y + eb2.h) {
          soundClick();
          if (eb2.id === "continue") { this.state = PLAYING; setMusicMode("game"); return; }
          if (eb2.id === "exit") { this.state = MENU; setMusicMode("menu"); return; }
        }
      }
      return;
    }
  },

  draw: function() {
    if (bgImage) {
      var imgRatio = bgImage.width / bgImage.height;
      var screenRatio = W / H;
      var dw, dh, dx, dy;
      if (imgRatio > screenRatio) { dh = H; dw = H * imgRatio; dx = (W - dw) / 2; dy = 0; }
      else { dw = W; dh = W / imgRatio; dx = 0; dy = (H - dh) / 2; }
      ctx.drawImage(bgImage, dx, dy, dw, dh);
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillRect(0, 0, W, H);
    } else if (bgColor) {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.fillStyle = "#0a0a0f";
      ctx.fillRect(0, 0, W, H);
    }

    if (this.state === GAME_OVER || this.state === ENDLESS_QUIT || this.state === CONFIRM_RESET) {
      var progress = Math.min(1, this.gameOverTime / GAMEOVER_FADE_DURATION);
      var dim = (this.state === CONFIRM_RESET) ? 1 : progress;
      ctx.fillStyle = "rgba(0, 0, 0, " + (0.45 * dim) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    if (this.state === MENU) this.drawMenu();
    else if (this.state === SOON) this.drawSoon();
    else if (this.state === MODE_SELECT) this.drawModeSelect();
    else if (this.state === MODE_INFO) this.drawModeInfo();
    else if (this.state === PLAYING) this.drawPlaying();
    else if (this.state === GAME_OVER) this.drawGameOver();
    else if (this.state === ENDLESS_QUIT) this.drawEndlessQuit();
    else if (this.state === SETTINGS) this.drawSettings();
    else if (this.state === SETTINGS_BG) this.drawSettingsBg();
    else if (this.state === SETTINGS_SQUARE) this.drawSettingsSquare();
    else if (this.state === SETTINGS_SOUND) this.drawSettingsSound();
    else if (this.state === STATS) this.drawStats();
    else if (this.state === ACHIEVEMENTS) this.drawAchievements();
    else if (this.state === CONFIRM_RESET) this.drawConfirmReset();

    // Плашка достижения — рисуется всегда, поверх всего
    drawToast();
  },

  drawAchievements: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 30px " + FONT_FAMILY;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ДОСТИЖЕНИЯ", W / 2, H * 0.04);

    // вкладки
    var tabs = [
      { id: "common",   label: "Общие" },
      { id: "timed",    label: "На время" },
      { id: "endless",  label: "Свободный" },
      { id: "sprint",   label: "Спринт" },
      { id: "accuracy", label: "Точность" }
    ];

    var tabY = H * 0.09;
    var tabW = Math.min((W - 20) / 5, 100);
    var totalW = tabW * 5;
    var tabStartX = (W - totalW) / 2;
    var tabH = 32;

    this.buttons = [];
    for (var ti = 0; ti < tabs.length; ti++) {
      var tab = tabs[ti];
      var tx = tabStartX + ti * tabW;
      var isActive = (this.achTab === tab.id);
      var btn = { x: tx, y: tabY, w: tabW - 2, h: tabH, text: tab.label, id: "tab_" + tab.id };
      this.buttons.push(btn);

      ctx.fillStyle = isActive ? "#3c3c50" : "#232332";
      ctx.fillRect(tx, tabY, tabW - 2, tabH);
      ctx.strokeStyle = isActive ? "#f0c050" : "#50505a";
      ctx.lineWidth = isActive ? 2 : 1;
      ctx.strokeRect(tx, tabY, tabW - 2, tabH);
      ctx.fillStyle = "#f0f0f0";
      ctx.font = "bold 10px " + FONT_FAMILY;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(tab.label, tx + (tabW - 2) / 2, tabY + tabH / 2);
    }

    // фильтр достижений по вкладке
    var visible = [];
    for (var ai = 0; ai < ACHIEVEMENTS_LIST.length; ai++) {
      if (ACHIEVEMENTS_LIST[ai].cat === this.achTab) visible.push(ACHIEVEMENTS_LIST[ai]);
    }

    // прокрутка
    var listTop = tabY + tabH + 12;
    var listBottom = H - 150;
    var cardH = 110;
    var cardGap = 8;
    var contentH = visible.length * (cardH + cardGap);
    var viewH = listBottom - listTop;

    this.achMaxScroll = Math.max(0, contentH - viewH);
    if (this.achScroll > this.achMaxScroll) this.achScroll = this.achMaxScroll;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, listTop, W, viewH);
    ctx.clip();

    var cardX = 20;
    var cardW = W - 40;

    for (var vi = 0; vi < visible.length; vi++) {
      var a = visible[vi];
      var cy = listTop + vi * (cardH + cardGap) - this.achScroll;

      if (cy + cardH < listTop - 20) continue;
      if (cy > listBottom + 20) continue;

      var earned = !!achievementsEarned[a.id];
      var bgC = earned ? "#2a2a3a" : "#1a1a24";
      var bdC = earned ? "#f0c050" : "#404050";

      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 3;
      ctx.fillStyle = bgC;
      ctx.fillRect(cardX, cy, cardW, cardH);
      ctx.restore();

      ctx.strokeStyle = bdC;
      ctx.lineWidth = 2;
      ctx.strokeRect(cardX, cy, cardW, cardH);

      ctx.fillStyle = earned ? "#f0c050" : "#606070";
      ctx.font = "bold 26px " + FONT_FAMILY;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(earned ? "🏆" : "🔒", cardX + 12, cy + 12);

      ctx.fillStyle = earned ? "#ffffff" : "#9090a0";
      ctx.font = "bold 15px " + FONT_FAMILY;
      ctx.fillText(a.name, cardX + 54, cy + 12);

      ctx.fillStyle = "#a0a0b0";
      ctx.font = "12px " + FONT_FAMILY;
      ctx.fillText(a.desc, cardX + 54, cy + 34);

      if (earned) {
        var dateStr = "";
        var ts = achievementsEarned[a.id];
        if (ts) {
          var d2 = new Date(ts);
          var dd = d2.getDate();
          var mm = d2.getMonth() + 1;
          var yyyy = d2.getFullYear();
          dateStr = (dd < 10 ? "0" : "") + dd + "." + (mm < 10 ? "0" : "") + mm + "." + yyyy;
        }
        ctx.fillStyle = "#f0c050";
        ctx.font = "11px " + FONT_FAMILY;
        ctx.fillText("Получено: " + dateStr, cardX + 54, cy + 58);
      } else if (a.progress) {
        var pr = a.progress({});
        if (pr && pr.length === 2 && pr[1] > 0) {
          ctx.fillStyle = "#c0c0d0";
          ctx.font = "12px " + FONT_FAMILY;
          if (pr[1] === 1) {
            ctx.fillText(pr[0] === 1 ? "Ещё не выполнено" : "Ещё не выполнено", cardX + 54, cy + 58);
          } else {
            ctx.fillText("Прогресс: " + pr[0] + " / " + pr[1], cardX + 54, cy + 58);
          }
        }
      }

      // прогресс-бар
      if (!earned && a.progress) {
        var pr2 = a.progress({});
        if (pr2 && pr2.length === 2 && pr2[1] > 1) {
          var pct = Math.min(1, pr2[0] / pr2[1]);
          var barX = cardX + 54;
          var barY = cy + 78;
          var barW = cardW - 54 - 12;
          var barH = 8;
          ctx.fillStyle = "#3a3a4a";
          ctx.fillRect(barX, barY, barW, barH);
          ctx.fillStyle = "#f0c050";
          ctx.fillRect(barX, barY, barW * pct, barH);
        }
      }
    }

    ctx.restore();

    // прокрутка — индикатор справа
    if (this.achMaxScroll > 0) {
      var scrollBarX = W - 6;
      var scrollBarW = 3;
      var ratio = viewH / contentH;
      var thumbH = Math.max(30, viewH * ratio);
      var thumbY = listTop + (this.achScroll / this.achMaxScroll) * (viewH - thumbH);
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fillRect(scrollBarX, listTop, scrollBarW, viewH);
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.fillRect(scrollBarX, thumbY, scrollBarW, thumbH);
    }

    var bw = Math.min(320, W - 60);
    var bx = (W - bw) / 2;

    var bReset = { x: bx, y: H - 130, w: bw, h: 50, text: "Сбросить", id: "reset_ach" };
    var bBack = { x: bx, y: H - 70, w: bw, h: 50, text: "Назад", id: "back" };
    this.buttons.push(bReset);
    this.buttons.push(bBack);
    drawButtons([bReset, bBack]);
    drawSignature();
  },

function drawButtons(list) {
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    var hover = game.mouse.x >= b.x && game.mouse.x <= b.x + b.w &&
                game.mouse.y >= b.y && game.mouse.y <= b.y + b.h;

    // пульсация при hover — небольшое увеличение
    var scale = 1;
    var bX = b.x, bY = b.y, bW = b.w, bH = b.h;
    if (hover) {
      scale = 1 + Math.sin(Date.now() / 250) * 0.015; // ±1.5%
      var cx = b.x + b.w / 2;
      var cy = b.y + b.h / 2;
      bW = b.w * scale;
      bH = b.h * scale;
      bX = cx - bW / 2;
      bY = cy - bH / 2;
    }

    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = hover ? "#3c3c50" : "#232332";
    ctx.fillRect(bX, bY, bW, bH);
    ctx.restore();
    ctx.strokeStyle = "#50505a"; ctx.lineWidth = 2;
    ctx.strokeRect(bX, bY, bW, bH);
    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 17px " + FONT_FAMILY;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.text, bX + bW/2, bY + bH/2);
  }
}

// ---------- ВВОД ----------
function posFromEvent(e) {
  var rect = canvas.getBoundingClientRect();
  var cx, cy;
  if (e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches.length) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
  else { cx = e.clientX; cy = e.clientY; }
  return { x: cx - rect.left, y: cy - rect.top };
}

function detectDragTarget(px, py) {
  var PAD_Y = 30, PAD_X = 20;
  if (game.state === SETTINGS_SOUND) {
    if (window.__fxBar) {
      var fb = window.__fxBar;
      if (px >= fb.x - PAD_X && px <= fb.x + fb.w + PAD_X &&
          py >= fb.y - PAD_Y && py <= fb.y + fb.h + PAD_Y) return "fx";
    }
    if (window.__musicBar) {
      var mb = window.__musicBar;
      if (px >= mb.x - PAD_X && px <= mb.x + mb.w + PAD_X &&
          py >= mb.y - PAD_Y && py <= mb.y + mb.h + PAD_Y) return "music";
    }
  }
  if (game.state === SETTINGS_BG) {
    if (window.__pickerGrad) {
      var g = window.__pickerGrad;
      if (px >= g.x && px <= g.x + g.w && py >= g.y && py <= g.y + g.h) return "pickerGrad";
    }
    if (window.__pickerBar) {
      var bar = window.__pickerBar;
      if (px >= bar.x - 20 && px <= bar.x + bar.w + 20 && py >= bar.y - 10 && py <= bar.y + bar.h + 10) return "pickerBar";
    }
    if (window.__pickerHue) {
      var hb = window.__pickerHue;
      if (px >= hb.x && px <= hb.x + hb.w && py >= hb.y - 15 && py <= hb.y + hb.h + 15) return "pickerHue";
    }
  }
  if (game.state === SETTINGS_SQUARE) {
    if (window.__sqPickerGrad) {
      var sg = window.__sqPickerGrad;
      if (px >= sg.x && px <= sg.x + sg.w && py >= sg.y && py <= sg.y + sg.h) return "sqPickerGrad";
    }
    if (window.__sqPickerBar) {
      var sbar = window.__sqPickerBar;
      if (px >= sbar.x - 20 && px <= sbar.x + sbar.w + 20 && py >= sbar.y - 10 && py <= sbar.y + sbar.h + 10) return "sqPickerBar";
    }
    if (window.__sqPickerHue) {
      var shb = window.__sqPickerHue;
      if (px >= shb.x && px <= shb.x + shb.w && py >= shb.y - 15 && py <= shb.y + shb.h + 15) return "sqPickerHue";
    }
  }
  return null;
}

function xToVolume(x, barX, trackW) {
  var left = barX, right = barX + trackW;
  if (x <= left) return 0;
  if (x >= right) return 1;
  return (x - left) / trackW;
}

function handleDrag(px, py) {
  if (dragging === "fx" && window.__fxBar) {
    var fb = window.__fxBar;
    fxVolume = xToVolume(px, fb.x, fb.w);
    try { localStorage.setItem("catchme_fxvol", fxVolume); } catch(e) {}
    return;
  }
  if (dragging === "music" && window.__musicBar) {
    var mb = window.__musicBar;
    musicVolume = xToVolume(px, mb.x, mb.w);
    try { localStorage.setItem("catchme_musicvol", musicVolume); } catch(e) {}
    if (musicVolume <= 0) stopMusic();
    else ensureMusicPlaying();
    return;
  }
  if (dragging === "pickerGrad" && window.__pickerGrad) {
    var g = window.__pickerGrad;
    picker.sat = Math.max(0, Math.min(1, (px - g.x) / g.w));
    picker.val = 1 - Math.max(0, Math.min(1, (py - g.y) / g.h));
    var rgb = hsvToRgb(picker.hue, picker.sat, picker.val);
    pickBgColor(rgbToHex(rgb[0], rgb[1], rgb[2]));
    return;
  }
  if (dragging === "pickerBar" && window.__pickerBar) {
    var bar = window.__pickerBar;
    picker.val = 1 - Math.max(0, Math.min(1, (py - bar.y) / bar.h));
    var rgb2 = hsvToRgb(picker.hue, picker.sat, picker.val);
    pickBgColor(rgbToHex(rgb2[0], rgb2[1], rgb2[2]));
    return;
  }
  if (dragging === "pickerHue" && window.__pickerHue) {
    var hb = window.__pickerHue;
    picker.hue = ((px - hb.x) / hb.w) * 360;
    if (picker.hue < 0) picker.hue = 0;
    if (picker.hue > 360) picker.hue = 360;
    var rgb3 = hsvToRgb(picker.hue, picker.sat, picker.val);
    pickBgColor(rgbToHex(rgb3[0], rgb3[1], rgb3[2]));
    return;
  }
  if (dragging === "sqPickerGrad" && window.__sqPickerGrad) {
    var sg = window.__sqPickerGrad;
    squarePicker.sat = Math.max(0, Math.min(1, (px - sg.x) / sg.w));
    squarePicker.val = 1 - Math.max(0, Math.min(1, (py - sg.y) / sg.h));
    var srgb = hsvToRgb(squarePicker.hue, squarePicker.sat, squarePicker.val);
    pickSquareColor(rgbToHex(srgb[0], srgb[1], srgb[2]));
    return;
  }
  if (dragging === "sqPickerBar" && window.__sqPickerBar) {
    var sbar = window.__sqPickerBar;
    squarePicker.val = 1 - Math.max(0, Math.min(1, (py - sbar.y) / sbar.h));
    var srgb2 = hsvToRgb(squarePicker.hue, squarePicker.sat, squarePicker.val);
    pickSquareColor(rgbToHex(srgb2[0], srgb2[1], srgb2[2]));
    return;
  }
  if (dragging === "sqPickerHue" && window.__sqPickerHue) {
    var shb = window.__sqPickerHue;
    squarePicker.hue = ((px - shb.x) / shb.w) * 360;
    if (squarePicker.hue < 0) squarePicker.hue = 0;
    if (squarePicker.hue > 360) squarePicker.hue = 360;
    var srgb3 = hsvToRgb(squarePicker.hue, squarePicker.sat, squarePicker.val);
    pickSquareColor(rgbToHex(srgb3[0], srgb3[1], srgb3[2]));
    return;
  }
}

// скролл достижений
function startAchScroll(py) {
  if (game.state !== ACHIEVEMENTS) return false;
  var listTop = H * 0.09 + 32 + 12;
  var listBottom = H - 150;
  if (py < listTop || py > listBottom) return false;
  game.achDragging = true;
  game.achTouchY = py;
  game.achTouchTime = Date.now();
  return true;
}
function moveAchScroll(py) {
  if (!game.achDragging) return;
  var dy = game.achTouchY - py;
  game.achScroll += dy;
  if (game.achScroll < 0) game.achScroll = 0;
  if (game.achScroll > game.achMaxScroll) game.achScroll = game.achMaxScroll;
  game.achTouchY = py;
}
function endAchScroll() {
  game.achDragging = false;
}

canvas.addEventListener("wheel", function(e) {
  if (game.state === ACHIEVEMENTS) {
    e.preventDefault();
    game.achScroll += e.deltaY * 0.5;
    if (game.achScroll < 0) game.achScroll = 0;
    if (game.achScroll > game.achMaxScroll) game.achScroll = game.achMaxScroll;
  }
}, { passive: false });

canvas.addEventListener("mousemove", function(e) {
  var p = posFromEvent(e);
  game.mouse.x = p.x;
  game.mouse.y = p.y;
  if (dragging) handleDrag(p.x, p.y);
});

canvas.addEventListener("mousedown", function(e) {
  var p = posFromEvent(e);
  game.mouse.x = p.x; game.mouse.y = p.y;

  // проверка начала скролла достижений
  if (startAchScroll(p.y)) return;

  var target = detectDragTarget(p.x, p.y);
  if (target) {
    dragging = target;
    handleDrag(p.x, p.y);
    return;
  }
  game.click(p.x, p.y);
});

canvas.addEventListener("mouseup", function() {
  dragging = null;
  endAchScroll();
});
canvas.addEventListener("mouseleave", function() {
  dragging = null;
  endAchScroll();
});

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  var p = posFromEvent(e);
  game.mouse.x = p.x; game.mouse.y = p.y;

  // скролл достижений
  if (startAchScroll(p.y)) return;

  var target = detectDragTarget(p.x, p.y);
  if (target) {
    dragging = target;
    handleDrag(p.x, p.y);
    return;
  }
  game.click(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", function(e) {
  e.preventDefault();
  var p = posFromEvent(e);
  game.mouse.x = p.x; game.mouse.y = p.y;
  if (game.achDragging) { moveAchScroll(p.y); return; }
  if (dragging) handleDrag(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchend", function(e) {
  e.preventDefault();
  dragging = null;
  endAchScroll();
}, { passive: false });

canvas.addEventListener("touchcancel", function(e) {
  dragging = null;
  endAchScroll();
}, { passive: false });

// ---------- ЦИКЛ ----------
var lastTime = Date.now();
function loop() {
  var now = Date.now();
  var dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  game.update(dt);
  game.draw();
  requestAnimationFrame(loop);
}

// ---------- СТАРТ ----------
loadStats();
game.reset();
initBg();
initSqImage();
musicMode = "menu";
loop();
</script>
