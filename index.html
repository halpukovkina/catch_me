    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: "Cascadia Code", Consolas, Monaco, monospace;
    user-select: none;

  for (var i = 0; i < DIFFICULTIES.length; i++) {

  if (modeId === "timed") return diff.timedSeconds + " сек";

  if (diff.id === "easy") return "медленнее, крупнее";

// рекорды — по комбинации mode + diff
function recordKey(mode, diff) { return "catchme_record_" + mode + "_" + diff; }
function loadRecord(mode, diff) {
  try {
    var v = localStorage.getItem(recordKey(mode, diff));
    if (v === null) return 0;
    return parseInt(v) || 0;
  } catch(e) { return 0; }
}
function saveRecord(mode, diff, value) {
  try { localStorage.setItem(recordKey(mode, diff), String(value)); } catch(e) {}
}

function pickScoreMessage(score) {
  for (var i = 0; i < MESSAGE_BUCKETS_SCORE.length; i++) {
    var b = MESSAGE_BUCKETS_SCORE[i];
    if (score >= b.minScore && score <= b.maxScore) {
      return b.messages[Math.floor(Math.random() * b.messages.length)];
    }
  }
  return "Конец.";
}

function pickSprintMessage(time) {
  for (var i = 0; i < MESSAGE_BUCKETS_SPRINT.length; i++) {
    var b = MESSAGE_BUCKETS_SPRINT[i];
    if (time >= b.minTime && time < b.maxTime) {
      return b.messages[Math.floor(Math.random() * b.messages.length)];
    }
  }
  return "Конец.";
}

function pickEndlessMessage() {
  return MESSAGE_ENDLESS[Math.floor(Math.random() * MESSAGE_ENDLESS.length)];
}

var MISS_FADE_DURATION = 0.3;

// ---------- ЗВУК ----------
var soundEnabled = true;
try {
  var savedSound = localStorage.getItem("catchme_sound");
  if (savedSound !== null) soundEnabled = (savedSound === "1");
} catch(e) {}

var fxVolume = 0.7;
try {
  var sv = localStorage.getItem("catchme_fxvol");
  if (sv !== null) fxVolume = parseFloat(sv);
} catch(e) {}

var musicVolume = 0.5;
try {
  var mv = localStorage.getItem("catchme_musicvol");
  if (mv !== null) musicVolume = parseFloat(mv);
} catch(e) {}

var audioCtx = null;
var audioReady = false;

function initAudio() {
  if (audioReady) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    audioReady = true;
  } catch(e) {}
}

function unlockAudio() {
  if (!audioReady) initAudio();
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume().catch(function(){});
  }
  if (audioReady && soundEnabled) ensureMusicPlaying();
}

function playTone(freq, duration, type, volumeScale, freqEnd) {
  if (!soundEnabled) return;
  if (fxVolume <= 0) return;
  if (!audioReady) initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume().catch(function(){});
  try {
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd !== undefined) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), now + duration);
    }
    var peak = fxVolume * (volumeScale || 1) * 0.3;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  } catch(e) {}
}

function soundHit(score) {
  var baseFreq = 700 + Math.min(Math.max(score, 0) * 40, 800);
  playTone(baseFreq, 0.08, "square", 0.8);
}
function soundMissClick() { playTone(180, 0.09, "triangle", 0.5); }
function soundGameOver() { playTone(500, 0.5, "sine", 0.9, 120); }
function soundStart()    { playTone(400, 0.15, "sine", 0.7, 800); }
function soundClick()    { playTone(900, 0.04, "square", 0.4); }
function soundTeleport() { playTone(300, 0.12, "sine", 0.5, 1200); }
function soundBoost()    { playTone(1100, 0.06, "triangle", 0.5); }
function soundFinish()   { playTone(880, 0.15, "square", 0.9); playTone(1318, 0.25, "square", 0.9); }

var MELODY_GAMEOVER = [440.00, 415.30, 392.00, 349.23, 329.63, 293.66, 261.63, 220.00];

var musicPlaying = false;

var musicStep = 0;
var musicMode = "menu";

var MELODY_TEMPO = 220;

function getCurrentMelody() {
  if (musicMode === "menu") return MELODY_MENU;
  if (musicMode === "gameover") return MELODY_GAMEOVER;
  if (musicMode === "game") {
    if (gameTrackIndex === 0) return MELODY_GAME1;
    if (gameTrackIndex === 1) return MELODY_GAME2;
    return MELODY_GAME3;
  }
  return MELODY_MENU;
}
function getCurrentBass() {
  if (musicMode === "menu") return BASS_MENU;
  if (musicMode === "gameover") return BASS_GAMEOVER;
  if (musicMode === "game") {
    if (gameTrackIndex === 0) return BASS_GAME1;
    if (gameTrackIndex === 1) return BASS_GAME2;
    return BASS_GAME3;
  }
  return BASS_MENU;
}

function playMusicNote() {
  if (!audioCtx || !soundEnabled || musicVolume <= 0) return;
  if (musicMode === "silent") return;
  var melody = getCurrentMelody();
  var bassLine = getCurrentBass();
  var now = audioCtx.currentTime;
  var idx = musicStep % melody.length;

  var f = melody[idx];
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(f, now);
    var peak = musicVolume * 0.07;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.20);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.22);
  } catch(e) {}

  if (idx % 4 === 0 && musicMode !== "gameover") {
    try {
      var oscC = audioCtx.createOscillator();
      var gainC = audioCtx.createGain();
      oscC.type = "square";
      oscC.frequency.setValueAtTime(f * 1.25, now);
      var peakC = musicVolume * 0.04;
      gainC.gain.setValueAtTime(0.0001, now);
      gainC.gain.exponentialRampToValueAtTime(peakC, now + 0.01);
      gainC.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      oscC.connect(gainC); gainC.connect(audioCtx.destination);
      oscC.start(now); oscC.stop(now + 0.24);
    } catch(e) {}
  }

  if (idx % 2 === 0) {
    var bassF = bassLine[Math.floor(idx / 2) % bassLine.length];
    try {
      var oscB = audioCtx.createOscillator();
      var gainB = audioCtx.createGain();
      oscB.type = "triangle";
      oscB.frequency.setValueAtTime(bassF, now);
      var peakB = musicVolume * 0.11;
      gainB.gain.setValueAtTime(0.0001, now);
      gainB.gain.exponentialRampToValueAtTime(peakB, now + 0.01);
      gainB.gain.exponentialRampToValueAtTime(0.0001, now + 0.40);
      oscB.connect(gainB); gainB.connect(audioCtx.destination);
      oscB.start(now); oscB.stop(now + 0.42);
    } catch(e) {}
  }

  musicStep++;
  if (musicStep >= melody.length) {
    musicStep = 0;
    onMelodyEnd();
  }
}

function onMelodyEnd() {
  if (musicMode === "game") gameTrackIndex = (gameTrackIndex + 1) % 3;
  else if (musicMode === "gameover") { stopMusic(); musicMode = "silent"; }
}

function startMusic() {
  if (musicPlaying) return;
  if (!audioReady) initAudio();
  if (!audioCtx) return;
  if (!soundEnabled || musicVolume <= 0) return;
  if (musicMode === "silent") return;
  musicPlaying = true;
  musicStep = 0;
  playMusicNote();
  musicTimer = setInterval(playMusicNote, MELODY_TEMPO);
}

function stopMusic() {
  if (!musicPlaying) return;
  musicPlaying = false;
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

function setMusicMode(mode) {
  stopMusic();
  musicMode = mode;
  musicStep = 0;
  if (mode === "game") gameTrackIndex = 0;

}

function ensureMusicPlaying() {

function darkenColor(hex, factor) {
  var rgb = hexToRgb(hex);
  if (!rgb) return hex;
  var r = Math.round(rgb[0] * (1 - factor));
  var g = Math.round(rgb[1] * (1 - factor));
  var b = Math.round(rgb[2] * (1 - factor));
  return rgbToHex(r, g, b);
}

var bgColor = null;
try { bgColor = localStorage.getItem("catchme_bgcolor") || null; } catch(e) {}
var squareColor = null;
try { squareColor = localStorage.getItem("catchme_squarecolor") || null; } catch(e) {}

function hsvToRgb(h, s, v) {
  var c = v * s;
  var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  var m = v - c;
  var r = 0, g = 0, b = 0;
  if (h < 60)       { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rgbToHex(r, g, b) {
  function h(x) { var s = x.toString(16); return s.length === 1 ? "0" + s : s; }
  return "#" + h(r) + h(g) + h(b);
}
function hexToRgb(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  if (hex.length !== 6) return null;
  var num = parseInt(hex, 16);
  if (isNaN(num)) return null;
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function initPickerFromColorObj(picker, hex) {
  if (!hex) return;
  var rgb = hexToRgb(hex);
  if (!rgb) return;
  var r = rgb[0]/255, g = rgb[1]/255, b = rgb[2]/255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var d = max - min, h = 0;
  if (d !== 0) {
    if (max === r) h = 60 * (((g-b)/d) % 6);
    else if (max === g) h = 60 * ((b-r)/d + 2);
    else h = 60 * ((r-g)/d + 4);
  }
  if (h < 0) h += 360;
  picker.hue = h;
  picker.sat = max === 0 ? 0 : d/max;
  picker.val = max;
}

var picker = { hue: 0, sat: 1, val: 1 };
initPickerFromColorObj(picker, bgColor);
var squarePicker = { hue: 0, sat: 1, val: 1 };
initPickerFromColorObj(squarePicker, squareColor);

// ---------- IndexedDB ----------
var bgImage = null, bgImageURL = null;
var sqImage = null, sqImageURL = null;

function openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open("catchme_db", 2);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains("bg")) db.createObjectStore("bg");
      if (!db.objectStoreNames.contains("square")) db.createObjectStore("square");
    };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}
function saveToStore(s, blob) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(s, "readwrite");
      tx.objectStore(s).put(blob, "image");
      tx.oncomplete = function() { res(); };
      tx.onerror = function(e) { rej(e.target.error); };
    });
  });
}
function loadFromStore(s) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(s, "readonly");
      var req = tx.objectStore(s).get("image");
      req.onsuccess = function() { res(req.result || null); };
      req.onerror = function(e) { rej(e.target.error); };
    });
  });
}
function deleteFromStore(s) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(s, "readwrite");
      tx.objectStore(s).delete("image");
      tx.oncomplete = function() { res(); };
      tx.onerror = function(e) { rej(e.target.error); };
    });
  });
}
function applyBgFromBlob(blob) {
  if (bgImageURL) { URL.revokeObjectURL(bgImageURL); bgImageURL = null; }
  bgImageURL = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function() { bgImage = img; };
  img.src = bgImageURL;
}
function applySqFromBlob(blob) {
  if (sqImageURL) { URL.revokeObjectURL(sqImageURL); sqImageURL = null; }
  sqImageURL = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function() { sqImage = img; };
  img.src = sqImageURL;
}
function initBg() {

function overlapsExitZone(x, y, size) {
  if (!exitButtonZone) return false;
  var half = size/2;
  var l = x-half, r = x+half, t = y-half, b = y+half;
  var eb = exitButtonZone;

}

// ---------- ЧАСТИЦЫ ----------
var particles = [];

function spawnParticles(x, y, baseSize, color, useImage) {
  var count = 16;
  for (var i = 0; i < count; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 100 + Math.random() * 200;
    var size = 3 + Math.random() * 4;
    var srcX = Math.random();
    var srcY = Math.random();
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.6, maxLife: 0.6,
      size: size, color: color,
      useImage: useImage,
      srcX: srcX, srcY: srcY,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 6
    });
  }
}

function updateParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.rotation += p.rotSpeed * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    var hs = p.size / 2;
    if (p.useImage && sqImage) {
      var imgW = sqImage.width;
      var imgH = sqImage.height;
      var side = Math.min(imgW, imgH);
      var cropX = p.srcX * (imgW - side);
      var cropY = p.srcY * (imgH - side);
      ctx.drawImage(sqImage, cropX, cropY, side, side, -hs, -hs, p.size, p.size);
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(-hs, -hs, p.size, p.size);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------- КВАДРАТИК ----------
function Square() {
  var d = getDifficulty();
  this.baseSize = d.sizeStart;
  this.x = Math.random() * (W - 100) + 50;
  this.y = Math.random() * (H - 100) + 50;
  this.color = squareColor || COLORS[Math.floor(Math.random() * COLORS.length)];
  this.speed = 2.0;
  this.behavior = "run";
  this.huntTimer = 0;
  this.fake = false;
  this.teleportCooldown = 0;
  this.boostTimer = BOOST_INTERVAL;
  this.boostActive = 0;
  this.disguiseTimer = 60;
  this.popPhase = "none";
  this.popTime = 0;
  this.spawnTime = 0;
  this.missPhase = "none";
  this.missTime = 0;
  this.dead = false;
  this.removed = false;
}

Square.prototype.startPop = function() {
  this.popPhase = "in"; this.popTime = 0; this.dead = true;
};
Square.prototype.startMiss = function() {
  this.missPhase = "blink"; this.missTime = 0; this.dead = true;
};

Square.prototype.update = function(mx, my, score, dt) {
  if (!dt) dt = 1/60;
  var d = getDifficulty();

  if (this.popPhase !== "none") {
    this.popTime += dt;
    if (this.popPhase === "in") {
      if (this.popTime >= POP_DURATION_IN) {
        this.popPhase = "out"; this.popTime = 0;
        spawnParticles(this.x, this.y, this.baseSize, this.color, !!(sqImage && !this.fake));
      }
    } else if (this.popPhase === "out") {
      if (this.popTime >= POP_DURATION_OUT) {
        this.popPhase = "none"; this.removed = true;
      }
    }
    return;
  }
  if (this.missPhase !== "none") {
    this.missTime += dt;
    if (this.missPhase === "blink") {
      if (this.missTime >= MISS_BLINK_DURATION) { this.missPhase = "fade"; this.missTime = 0; }
    } else if (this.missPhase === "fade") {
      if (this.missTime >= MISS_FADE_DURATION) { this.missPhase = "none"; this.removed = true; }
    }
    return;
  }
  if (this.spawnTime < SPAWN_DURATION) this.spawnTime += dt;

  var current = LEVELS[0];
  for (var i = 0; i < LEVELS.length; i++) {
    if (score >= LEVELS[i].score) current = LEVELS[i];
  }
  this.speed = current.speed * d.speedMul;
  this.behavior = this.fake ? "run" : current.behavior;

  if (!this.fake) {
    this.baseSize = Math.max(d.sizeMin, d.sizeStart - score * d.sizeStep);
  }
  if (this.teleportCooldown > 0) this.teleportCooldown -= dt;

  var boostFactor = 1.0;
  if (this.behavior === "boost") {
    this.boostTimer -= dt;
    if (this.boostTimer <= 0 && this.boostActive <= 0) {
      this.boostActive = d.boostDuration;
      this.boostTimer = BOOST_INTERVAL;
      if (!this.fake) soundBoost();
    }
    if (this.boostActive > 0) { this.boostActive -= dt; boostFactor = d.boostMultiplier; }
  }

  var dx = this.x - mx, dy = this.y - my;
  var dist = Math.sqrt(dx*dx + dy*dy) || 1;
  dx /= dist; dy /= dist;
  var moveX = 0, moveY = 0;

  if (this.behavior === "run" || this.behavior === "boost" ||
      this.behavior === "disguise" || this.behavior === "multiply" ||
      this.behavior === "teleport") {
    moveX = dx * this.speed * boostFactor;
    moveY = dy * this.speed * boostFactor;
    if (this.behavior === "teleport" && this.teleportCooldown <= 0 && dist < TELEPORT_RADIUS) {
      var newX, newY, attempts = 0;
      do {
        newX = Math.random() * (W - 100) + 50;
        newY = Math.random() * (H - 100) + 50;
        attempts++;
      } while (attempts < 20 &&
        (Math.sqrt((newX-mx)*(newX-mx)+(newY-my)*(newY-my)) < TELEPORT_MIN_DIST ||
         overlapsExitZone(newX, newY, this.baseSize)));
      this.x = newX; this.y = newY;
      this.teleportCooldown = TELEPORT_COOLDOWN;
      if (!this.fake) soundTeleport();
      return;
    }
    if (this.behavior === "disguise") {
      this.disguiseTimer--;
      if (this.disguiseTimer <= 0) {
        if (!squareColor && !sqImage) {
          this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }
        this.disguiseTimer = 60;
      }
    }
  } else if (this.behavior === "hunt") {
    this.huntTimer--;
    if (this.huntTimer <= 0) {
      moveX = -dx * this.speed * 1.5; moveY = -dy * this.speed * 1.5;
      this.huntTimer = 90;
    } else {
      moveX = dx * this.speed * 0.5; moveY = dy * this.speed * 0.5;
    }
  }

  var newX2 = this.x + moveX;
  var newY2 = this.y + moveY;
  if (overlapsExitZone(newX2, newY2, this.baseSize)) {
    if (!overlapsExitZone(newX2, this.y, this.baseSize)) { newY2 = this.y; }
    else if (!overlapsExitZone(this.x, newY2, this.baseSize)) { newX2 = this.x; }
    else { newX2 = this.x; newY2 = this.y; }
  }
  this.x = newX2; this.y = newY2;
  this.x = Math.max(this.baseSize, Math.min(W - this.baseSize, this.x));
  this.y = Math.max(this.baseSize, Math.min(H - this.baseSize, this.y));
};

Square.prototype.getCurrentSize = function() {
  var s = this.baseSize;
  if (this.spawnTime < SPAWN_DURATION) {
    var t = this.spawnTime / SPAWN_DURATION;
    s = this.baseSize * t;
  }
  if (this.popPhase === "in") {
    var t1 = this.popTime / POP_DURATION_IN;
    s = this.baseSize * (1 + (POP_SCALE_MAX - 1) * t1);
  } else if (this.popPhase === "out") {
    var t2 = this.popTime / POP_DURATION_OUT;
    s = this.baseSize * POP_SCALE_MAX * (1 - t2);
  }
  return Math.max(0, s);
};

Square.prototype.getAlpha = function() {
  if (this.missPhase === "fade") {
    var t = this.missTime / MISS_FADE_DURATION;
    return Math.max(0, 1 - t);
  }
  return 1;
};

Square.prototype.getRedFlash = function() {
  if (this.missPhase === "blink") {
    var t = this.missTime / MISS_BLINK_DURATION;
    var cycles = 2;
    var val = Math.sin(t * Math.PI * 2 * cycles);
    return Math.max(0, val) * 0.15;
  }
  return 0;
};

Square.prototype.collides = function(mx, my) {
  var s = this.getCurrentSize();
  return Math.abs(mx - this.x) < s/2 && Math.abs(my - this.y) < s/2;
};

Square.prototype.draw = function() {
  var size = this.getCurrentSize();
  if (size <= 0) return;
  var alpha = this.getAlpha();
  var redFlash = this.getRedFlash();
  ctx.globalAlpha = alpha;
  var half = size / 2;
  var x = this.x - half;
  var y = this.y - half;
  var PAD = 3;
  var padX = x - PAD, padY = y - PAD, padSize = size + PAD * 2;

  if (!this.fake) {
    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 4;
    if (sqImage) {
      ctx.drawImage(sqImage, padX, padY, padSize, padSize);
    } else {
      var darkColor = darkenColor(this.color, 0.25);
      ctx.fillStyle = darkColor;
      ctx.fillRect(padX, padY, padSize, padSize);
    }
    ctx.restore();
  }

  if (sqImage) {
    ctx.drawImage(sqImage, padX, padY, padSize, padSize);
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.fillRect(padX, padY, padSize, padSize);
  } else {
    var darkColor2 = darkenColor(this.color, 0.25);
    ctx.fillStyle = darkColor2;
    ctx.fillRect(padX, padY, padSize, padSize);
  }

  if (sqImage) {
    ctx.drawImage(sqImage, x, y, size, size);
  } else {
    ctx.fillStyle = this.color;
    ctx.fillRect(x, y, size, size);
  }

  if (redFlash > 0) {
    ctx.fillStyle = "rgba(255, 0, 0, " + redFlash + ")";
    ctx.fillRect(x, y, size, size);
  }
  ctx.globalAlpha = 1;
};

    var d = getDifficulty();
    var rec = loadRecord("sprint", d.id);
    if (rec === 0 || this.elapsedTime < rec) {
      saveRecord("sprint", d.id, this.elapsedTime);
    }
    this.record = loadRecord("sprint", d.id);
    soundFinish();
    setMusicMode("gameover");
  },

  // выход из свободного — экран "уже уходишь?"
  quitEndless: function() {
    this.state = ENDLESS_QUIT;
    var d = getDifficulty();
    var rec = loadRecord("endless", d.id);
    if (this.score > rec) {
      saveRecord("endless", d.id, this.score);
    }
    this.record = loadRecord("endless", d.id);
    this.gameOverMessage = pickEndlessMessage();
    soundGameOver();
    setMusicMode("gameover");
  },

  // выход из точности — экран окончания
  quitAccuracy: function() {
    this.state = GAME_OVER;
    this.gameOverTime = 0;
    var d = getDifficulty();
    this.gameOverMessage = pickScoreMessage(this.score);
    var rec = loadRecord("accuracy", d.id);
    if (this.score > rec) {
      saveRecord("accuracy", d.id, this.score);
    }
    this.record = loadRecord("accuracy", d.id);
    soundGameOver();
    setMusicMode("gameover");
  },

  update: function(dt) {
    updatePopups(dt);
    updateParticles(dt);

    if (this.state === GAME_OVER || this.state === ENDLESS_QUIT) {
      if (this.gameOverTime < GAMEOVER_FADE_DURATION) {
        this.gameOverTime += dt;
      }
    }

    if (this.state !== PLAYING) {
      for (var d = this.deadSquares.length - 1; d >= 0; d--) {
        this.deadSquares[d].update(this.mouse.x, this.mouse.y, this.score, dt);
        if (this.deadSquares[d].removed) this.deadSquares.splice(d, 1);
      }
      return;
    }

    var mx = this.mouse.x, my = this.mouse.y;
    this.square.update(mx, my, this.score, dt);

    if (this.square.removed) this.square = new Square();

    if (this.square.behavior === "multiply" && this.fakeSquares.length < 2) {
      if (Math.random() < 0.015) {
        var fs = new Square();
        fs.fake = true;
        this.fakeSquares.push(fs);
      }
    }
    for (var i = this.fakeSquares.length - 1; i >= 0; i--) {
      this.fakeSquares[i].update(mx, my, this.score, dt);
      if (this.fakeSquares[i].removed) this.fakeSquares.splice(i, 1);
    }
    for (var d2 = this.deadSquares.length - 1; d2 >= 0; d2--) {
      this.deadSquares[d2].update(mx, my, this.score, dt);
      if (this.deadSquares[d2].removed) this.deadSquares.splice(d2, 1);
    }

    if (this.mode === "timed") {
      this.timeLeft -= dt;
      if (this.timeLeft <= 0) { this.timeLeft = 0; this.end(); }
    } else if (this.mode === "sprint") {
      this.elapsedTime += dt;
      var d = getDifficulty();
      if (this.score >= d.sprintTarget && !this.sprintDone) {
        this.sprintDone = true;
        this.finishSprint();
      }
    }
  }, 
  
     click: function(px, py) {
    unlockAudio();

    if (this.state === MENU) {
      for (var i = 0; i < this.buttons.length; i++) {
        var b = this.buttons[i];
        if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
          soundClick();
          if (b.id === "select_mode") this.state = MODE_SELECT;
          if (b.id === "settings") this.state = SETTINGS;
          if (b.id === "achievements") { this.state = SOON; this.soonTitle = "ДОСТИЖЕНИЯ"; }
          if (b.id === "stats") { this.state = SOON; this.soonTitle = "СТАТИСТИКА"; }
          return;
        }
      }
      return;
    }

    if (this.state === SOON) {
      for (var si = 0; si < this.buttons.length; si++) {
        var sb0 = this.buttons[si];
        if (px >= sb0.x && px <= sb0.x + sb0.w && py >= sb0.y && py <= sb0.y + sb0.h) {
          soundClick();
          if (sb0.id === "back") this.state = MENU;
          return;
        }
      }
      return;
    }

    if (this.state === MODE_SELECT) {
      for (var mi = 0; mi < this.buttons.length; mi++) {
        var mb = this.buttons[mi];
        if (px >= mb.x && px <= mb.x + mb.w && py >= mb.y && py <= mb.y + mb.h) {
          soundClick();
          if (mb.id === "back") { this.state = MENU; return; }
          if (mb.id.indexOf("mode_") === 0) {
            currentMode = mb.id.substring(5);
            this.state = MODE_INFO;
            return;
          }
        }
      }
      return;
    }

    if (this.state === MODE_INFO) {
      for (var ki = 0; ki < this.buttons.length; ki++) {
        var kb = this.buttons[ki];
        if (px >= kb.x && px <= kb.x + kb.w && py >= kb.y && py <= kb.y + kb.h) {
          soundClick();
          if (kb.id === "back") { this.state = MODE_SELECT; return; }
          if (kb.id.indexOf("diff_") === 0) {
            currentDifficulty = kb.id.substring(5);
            try { localStorage.setItem("catchme_difficulty", currentDifficulty); } catch(e) {}
            this.start(currentMode);
            return;
          }
        }
      }
      return;
    }

    if (this.state === SETTINGS) {
      for (var sk = 0; sk < this.buttons.length; sk++) {
        var skb = this.buttons[sk];
        if (px >= skb.x && px <= skb.x + skb.w && py >= skb.y && py <= skb.y + skb.h) {
          soundClick();
          if (skb.id === "bg") this.state = SETTINGS_BG;
          if (skb.id === "square") this.state = SETTINGS_SQUARE;
          if (skb.id === "sound") this.state = SETTINGS_SOUND;
          if (skb.id === "back") this.state = MENU;
          return;
        }
      }
      return;
    }

    if (this.state === SETTINGS_BG) {
      for (var m = 0; m < this.buttons.length; m++) {
        var bb = this.buttons[m];
        if (px >= bb.x && px <= bb.x + bb.w && py >= bb.y && py <= bb.y + bb.h) {
          soundClick();
          if (bb.id === "back") { hideHexInput(); this.state = SETTINGS; return; }
          if (bb.id === "hex") {
            showHexInput(bb.x, bb.y, bb.w, bb.h, bgColor || "#000000", "bg");
            hexInput.focus(); hexInput.select(); return;
          }
        }
      }
      return;
    }

    if (this.state === SETTINGS_SQUARE) {
      for (var sm = 0; sm < this.buttons.length; sm++) {
        var sbb = this.buttons[sm];
        if (px >= sbb.x && px <= sbb.x + sbb.w && py >= sbb.y && py <= sbb.y + sbb.h) {
          soundClick();
          if (sbb.id === "back") { hideHexInput(); this.state = SETTINGS; return; }
          if (sbb.id === "hex") {
            showHexInput(sbb.x, sbb.y, sbb.w, sbb.h, squareColor || "#ff5050", "square");
            hexInput.focus(); hexInput.select(); return;
          }
        }
      }
      return;
    }

    if (this.state === SETTINGS_SOUND) {
      for (var q = 0; q < this.buttons.length; q++) {
        var qb = this.buttons[q];
        if (px >= qb.x && px <= qb.x + qb.w && py >= qb.y && py <= qb.y + qb.h) {
          soundClick();
          if (qb.id === "toggle") {
            soundEnabled = !soundEnabled;
            try { localStorage.setItem("catchme_sound", soundEnabled ? "1" : "0"); } catch(e) {}
            if (soundEnabled) ensureMusicPlaying();
            else stopMusic();
            return;
          }
          if (qb.id === "test") { playTone(880, 0.15, "square", 0.8); return; }
          if (qb.id === "back") { this.state = SETTINGS; return; }
        }
      }
      return;
    }

    if (this.state === PLAYING) {
      if (window.__exitButton) {
        var eb = window.__exitButton;
        if (px >= eb.x && px <= eb.x + eb.w && py >= eb.y && py <= eb.y + eb.h) {
          soundClick();
          if (this.mode === "endless") {
            this.quitEndless();
          } else if (this.mode === "accuracy") {
            this.quitAccuracy();
          } else if (this.mode === "sprint") {
            // в спринте кнопка ✕ — просто выход без экрана
            this.state = MENU;
            setMusicMode("menu");
          } else {
            this.state = MENU;
            setMusicMode("menu");
          }
          return;
        }
      }

      // попал в настоящий
      if (!this.square.dead && this.square.collides(px, py)) {
        this.score++;
        spawnPopup(px, py);
        soundHit(this.score);

        var old = this.square;
        old.startPop();
        this.deadSquares.push(old);

        var newX, newY, attempts = 0;
        do {
          newX = Math.random() * (W - 100) + 50;
          newY = Math.random() * (H - 100) + 50;
          attempts++;
        } while (
          attempts < 20 &&
          (Math.sqrt((newX-px)*(newX-px)+(newY-py)*(newY-py)) < 150 ||
           overlapsExitZone(newX, newY, getDifficulty().sizeStart))
        );
        this.square = new Square();
        this.square.x = newX;
        this.square.y = newY;
        this.square.spawnTime = 0;

        for (var fi = 0; fi < this.fakeSquares.length; fi++) {
          if (!this.fakeSquares[fi].dead) {
            this.fakeSquares[fi].startMiss();
            this.deadSquares.push(this.fakeSquares[fi]);
          }
        }
        this.fakeSquares = [];

        if (this.mode === "sprint") {
          var d = getDifficulty();
          if (this.score >= d.sprintTarget && !this.sprintDone) {
            this.sprintDone = true;
            this.finishSprint();
          }
        }
        return;
      }

      // клик по ложному
      for (var fi2 = this.fakeSquares.length - 1; fi2 >= 0; fi2--) {
        var fsq = this.fakeSquares[fi2];
        if (!fsq.dead && fsq.collides(px, py)) {
          soundMissClick();
          fsq.startMiss();
          this.deadSquares.push(fsq);
          this.fakeSquares.splice(fi2, 1);

          if (this.mode === "accuracy") {
            this.score--;
          }
          return;
        }
      }

      // клик по пустому месту — в точности минус
      if (this.mode === "accuracy") {
        // проверяем, не попал ли клик в мёртвые (летящие) квадратики
        var hitDead = false;
        for (var di = 0; di < this.deadSquares.length; di++) {
          if (this.deadSquares[di].collides(px, py)) { hitDead = true; break; }
        }
        if (!hitDead) {
          soundMissClick();
          this.score--;
        }
      }

      return;
    }

    if (this.state === GAME_OVER) {
      if (this.gameOverTime < GAMEOVER_FADE_DURATION) return;
      for (var j = 0; j < this.buttons.length; j++) {
        var b2 = this.buttons[j];
        if (px >= b2.x && px <= b2.x + b2.w && py >= b2.y && py <= b2.y + b2.h) {
          soundClick();
          if (b2.id === "again") this.start(this.mode);
          if (b2.id === "menu") {
            this.state = MENU;
            setMusicMode("menu");
          }
          return;
        }
      }
      return;
    }

    if (this.state === ENDLESS_QUIT) {
      if (this.gameOverTime < GAMEOVER_FADE_DURATION) return;
      for (var ek = 0; ek < this.buttons.length; ek++) {
        var eb2 = this.buttons[ek];
        if (px >= eb2.x && px <= eb2.x + eb2.w && py >= eb2.y && py <= eb2.y + eb2.h) {
          soundClick();
          if (eb2.id === "continue") {
            this.state = PLAYING;
            setMusicMode("game");
            return;
          }
          if (eb2.id === "exit") {
            this.state = MENU;
            setMusicMode("menu");
            return;
          }
        }
      }
      return;
    }
  },

  draw: function() {
    if (bgImage) {
      var imgRatio = bgImage.width / bgImage.height;
      var screenRatio = W / H;
      var dw, dh, dx, dy;
      if (imgRatio > screenRatio) {
        dh = H; dw = H * imgRatio; dx = (W - dw) / 2; dy = 0;
      } else {
        dw = W; dh = W / imgRatio; dx = 0; dy = (H - dh) / 2;
      }
      ctx.drawImage(bgImage, dx, dy, dw, dh);
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillRect(0, 0, W, H);
    } else if (bgColor) {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.fillStyle = "#0a0a0f";
      ctx.fillRect(0, 0, W, H);
    }

    if (this.state === GAME_OVER || this.state === ENDLESS_QUIT) {
      var progress = Math.min(1, this.gameOverTime / GAMEOVER_FADE_DURATION);
      ctx.fillStyle = "rgba(0, 0, 0, " + (0.25 * progress) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    if (this.state === MENU) this.drawMenu();
    else if (this.state === SOON) this.drawSoon();
    else if (this.state === MODE_SELECT) this.drawModeSelect();
    else if (this.state === MODE_INFO) this.drawModeInfo();
    else if (this.state === PLAYING) this.drawPlaying();
    else if (this.state === GAME_OVER) this.drawGameOver();
    else if (this.state === ENDLESS_QUIT) this.drawEndlessQuit();
    else if (this.state === SETTINGS) this.drawSettings();
    else if (this.state === SETTINGS_BG) this.drawSettingsBg();
    else if (this.state === SETTINGS_SQUARE) this.drawSettingsSquare();
    else if (this.state === SETTINGS_SOUND) this.drawSettingsSound();
  },

    ctx.fillStyle = "#ffffff";

  drawModeSelect: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 40px " + FONT_FAMILY;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ВЫБРАТЬ РЕЖИМ", W / 2, H * 0.10);

    var bw = Math.min(340, W - 60);
    var bx = (W - bw) / 2;
    var startY = H * 0.22;
    var btnH = 55;
    var gap = 15;

    this.buttons = [];
    for (var i = 0; i < MODES.length; i++) {
      var m = MODES[i];
      var by = startY + i * (btnH + gap);
      var btn = { x: bx, y: by, w: bw, h: btnH, text: m.name, id: "mode_" + m.id };
      this.buttons.push(btn);
      drawButtons([btn]);
    }

    var backY = startY + MODES.length * (btnH + gap) + 10;
    if (backY + btnH > H - 20) backY = H - btnH - 20;
    var bBack = { x: bx, y: backY, w: bw, h: btnH, text: "Назад", id: "back" };
    this.buttons.push(bBack);
    drawButtons([bBack]);
  },

  drawModeInfo: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    var mode = null;
    for (var i = 0; i < MODES.length; i++) {
      if (MODES[i].id === currentMode) { mode = MODES[i]; break; }
    }
    if (!mode) mode = MODES[0];

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 38px " + FONT_FAMILY;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(mode.name.toUpperCase(), W / 2, H * 0.07);

    // описание — с переносами
    ctx.font = "16px " + FONT_FAMILY;
    ctx.fillStyle = "#c0c0d0";
    var desc = mode.desc;
    var maxWidth = Math.min(W - 60, 420);
    var words = desc.split(" ");
    var line = "";
    var lines = [];
    for (var wi = 0; wi < words.length; wi++) {
      var test = line + (line ? " " : "") + words[wi];
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = words[wi];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);

    var descY = H * 0.15;
    for (var li = 0; li < lines.length; li++) {
      ctx.fillText(lines[li], W / 2, descY + li * 22);
    }

    // "Выберите сложность:"
    var labelY = descY + lines.length * 22 + 20;
    ctx.fillStyle = "#a0a0b0";
    ctx.font = "16px " + FONT_FAMILY;
    ctx.fillText("Выберите сложность:", W / 2, labelY);

    // 4 кнопки сложности
    var bw = Math.min(340, W - 60);
    var bx = (W - bw) / 2;
    var startY = labelY + 25;
    var btnH = 52;
    var gap = 8;

    this.buttons = [];
    for (var d = 0; d < DIFFICULTIES.length; d++) {
      var diff = DIFFICULTIES[d];
      var by = startY + d * (btnH + gap);
      var label = diff.name + " — " + getDifficultyLabel(currentMode, diff);
      var isActive = (diff.id === currentDifficulty);
      if (isActive) label += " ✓";
      var btn = { x: bx, y: by, w: bw, h: btnH, text: label, id: "diff_" + diff.id };
      this.buttons.push(btn);
      drawButtons([btn]);
    }

    // кнопка "Назад" — МЕНЬШЕ, как просили (45px вместо 55)
    var backY = startY + DIFFICULTIES.length * (btnH + gap) + 5;
    if (backY + 45 > H - 15) backY = H - 45 - 15;
    var smallW = Math.min(200, bw - 40);
    var smallX = (W - smallW) / 2;
    var bBack = { x: smallX, y: backY, w: smallW, h: 45, text: "Назад", id: "back" };
    this.buttons.push(bBack);
    drawButtons([bBack]);
  },

  drawSettings: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 44px " + FONT_FAMILY;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("НАСТРОЙКИ", W / 2, H * 0.16);

    var bw = Math.min(320, W - 60);

    var bBg = { x: bx, y: H * 0.32, w: bw, h: 60, text: "Фон", id: "bg" };
    var bSq = { x: bx, y: H * 0.32 + 75, w: bw, h: 60, text: "Квадратик", id: "square" };
    var bSnd = { x: bx, y: H * 0.32 + 150, w: bw, h: 60, text: "Звук", id: "sound" };
    var bBack = { x: bx, y: H * 0.32 + 240, w: bw, h: 60, text: "Назад", id: "back" };
    this.buttons = [bBg, bSq, bSnd, bBack];
    drawButtons(this.buttons);
  },

  drawSettingsBg: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabelSq();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 36px " + FONT_FAMILY;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ФОН", W / 2, H * 0.06);

    var gradW = Math.min(W - 140, 400);
    var gradH = Math.min(H * 0.28, 200);
    var gradX = (W - gradW) / 2 - 20;
    var gradY = H * 0.11;

    if (!window.__gradCanvasCache ||
        window.__gradCanvasCache.width !== gradW ||
        window.__gradCanvasCache.height !== gradH ||
        window.__gradHue !== picker.hue) {
      window.__gradCanvasCache = document.createElement("canvas");
      window.__gradCanvasCache.width = gradW;
      window.__gradCanvasCache.height = gradH;
      var gctx = window.__gradCanvasCache.getContext("2d");
      var img = gctx.createImageData(gradW, gradH);
      var data = img.data;
      for (var yy = 0; yy < gradH; yy++) {
        for (var xx = 0; xx < gradW; xx++) {
          var s = xx / gradW;
          var v = 1 - yy / gradH;
          var rgb = hsvToRgb(picker.hue, s, v);
          var idx = (yy * gradW + xx) * 4;
          data[idx] = rgb[0]; data[idx+1] = rgb[1];
          data[idx+2] = rgb[2]; data[idx+3] = 255;
        }
      }
      gctx.putImageData(img, 0, 0);
    }
    window.__gradHue = picker.hue;
    ctx.drawImage(window.__gradCanvasCache, gradX, gradY, gradW, gradH);

    ctx.strokeStyle = "#606070"; ctx.lineWidth = 2;
    ctx.strokeRect(gradX, gradY, gradW, gradH);

    var markX = gradX + picker.sat * gradW;
    var markY = gradY + (1 - picker.val) * gradH;
    ctx.beginPath(); ctx.arc(markX, markY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(markX, markY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 1; ctx.stroke();

    window.__pickerGrad = { x: gradX, y: gradY, w: gradW, h: gradH };

    var barW = 40, barH = gradH;
    var barX = gradX + gradW + 20, barY = gradY;

    var grad = ctx.createLinearGradient(0, barY, 0, barY + barH);
    var topRgb = hsvToRgb(picker.hue, picker.sat, 1);

    ctx.lineWidth = 2;
    ctx.strokeRect(prevX, prevY, prevW, prevH);

    var sampleSize = 40;
    var sampleX = prevX + prevW/2 - sampleSize/2;

    if (sqImage) {
      ctx.drawImage(sqImage, sampleX, sampleY, sampleSize, sampleSize);

      var sampleColor = squareColor || "#ff5050";

      ctx.fillRect(sampleX, sampleY, sampleSize, sampleSize);

    if (!window.__sqGradCache ||

      window.__sqGradCache = document.createElement("canvas");
      window.__sqGradCache.width = gradW;
      window.__sqGradCache.height = gradH;
      var gctx2 = window.__sqGradCache.getContext("2d");
      var img2 = gctx2.createImageData(gradW, gradH);

      for (var yy2 = 0; yy2 < gradH; yy2++) {

          var v2 = 1 - yy2 / gradH;
          var rgb2 = hsvToRgb(squarePicker.hue, s2, v2);

    ctx.strokeRect(gradX, gradY, gradW, gradH);

    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(smarkX, smarkY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 1; ctx.stroke();

    window.__sqPickerGrad = { x: gradX, y: gradY, w: gradW, h: gradH };

    var sbarW = 40, sbarH = gradH;

    ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.5; ctx.stroke();

    window.__sqPickerBar = { x: sbarX, y: sbarY, w: sbarW, h: sbarH };

    ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; ctx.stroke();

    window.__sqPickerHue = { x: shueX, y: shueY, w: shueW, h: shueH };

    var sbtnW = Math.min(W - 80, 260);
    var sbtnX = (W - sbtnW) / 2;

    var sbUp = { x: sbtnX, y: sbtnY + 62, w: sbtnW, h: 55,

  drawPlaying: function() {
    hideFileLabel();
    hideHexInput();

    var exitSize = 48;
    var exitX = W - exitSize - 16;
    var exitY = 16;
    exitButtonZone = { x: exitX, y: exitY, w: exitSize, h: exitSize };

    for (var i = 0; i < this.fakeSquares.length; i++) this.fakeSquares[i].draw();
    for (var d = 0; d < this.deadSquares.length; d++) this.deadSquares[d].draw();
    this.square.draw();

    drawPopups();
    drawParticles();

    // счёт
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 24px " + FONT_FAMILY;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    if (this.mode === "sprint") {
      var d = getDifficulty();
      ctx.fillText("Поймано: " + this.score + "/" + d.sprintTarget, 20, 20);
      ctx.font = "20px " + FONT_FAMILY;
      ctx.fillText("Время: " + this.elapsedTime.toFixed(1) + " сек", 20, 52);
    } else {
      ctx.fillText("Очки: " + this.score, 20, 20);
      ctx.font = "20px " + FONT_FAMILY;
      if (this.mode === "timed") {
        ctx.fillText("Время: " + Math.ceil(this.timeLeft), 20, 52);
      } else if (this.mode === "accuracy") {
        ctx.fillText("Точность", 20, 52);
      } else {
        ctx.fillText("Свободный", 20, 52);
      }
    }

    var hover = game.mouse.x >= exitX && game.mouse.x <= exitX + exitSize &&
                game.mouse.y >= exitY && game.mouse.y <= exitY + exitSize;

    ctx.fillStyle = hover ? "#3c3c50" : "#232332";
    ctx.fillRect(exitX, exitY, exitSize, exitSize);
    ctx.strokeStyle = "#50505a"; ctx.lineWidth = 2;
    ctx.strokeRect(exitX, exitY, exitSize, exitSize);

    ctx.strokeStyle = "#f0f0f0"; ctx.lineWidth = 3;
    var pad = 14;
    ctx.beginPath();
    ctx.moveTo(exitX+pad, exitY+pad);
    ctx.lineTo(exitX+exitSize-pad, exitY+exitSize-pad);
    ctx.moveTo(exitX+exitSize-pad, exitY+pad);
    ctx.lineTo(exitX+pad, exitY+exitSize-pad);
    ctx.stroke();

    window.__exitButton = { x: exitX, y: exitY, w: exitSize, h: exitSize };
  },

      ctx.fillText("ФИНИШ!", W / 2, H * 0.18);
    } else if (this.mode === "accuracy") {
      ctx.fillText("Ты закончил", W / 2, H * 0.18);
    }

    ctx.font = "24px " + FONT_FAMILY;

    if (this.mode === "sprint") {
      // время и лучшее
      var curTime = this.elapsedTime.toFixed(1);

      // хранение рекорда в спринте — как целое число миллисекунд
      // но у нас elapsedTime в секундах
      // поэтому переделаем: рекорд храним в секундах * 1000 (миллисекунды)
      // НО чтобы не усложнять — сохраню как секунды * 10 (десятые доли секунды)
      // и при показе разделю на 10
      // проще: храним целое = секунды * 1000
      // ПРОСТО: храним как секунды с 1 знаком после запятой умноженные на 10
      // Переделаем: сохранение в finishSprint использует Math.round(elapsedTime * 1000)
      // Сейчас вывод:
      ctx.fillText("Время: " + curTime + " сек", W / 2, H * 0.34);
      ctx.fillStyle = "#ffffff";

      ctx.fillText("Твой счёт: " + this.score, W / 2, H * 0.34);

    }

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "18px " + FONT_FAMILY;
    ctx.fillText(this.gameOverMessage, W / 2, H * 0.52);

    if (progress >= 1) {
      var bw = Math.min(320, W - 60);

      drawButtons(this.buttons);
    }

    if (progress >= 1) {

      var totalX = (W - totalW) / 2;
      var gap = 12;
      var continueW = Math.round((totalW - gap) * 0.7);
      var exitW = totalW - gap - continueW;

      var b1 = { x: totalX, y: H * 0.62, w: continueW, h: 60, text: "Продолжить", id: "continue" };
      var b2 = { x: totalX + continueW + gap, y: H * 0.62, w: exitW, h: 60, text: "Выйти", id: "exit" };
      this.buttons = [b1, b2];
      drawButtons(this.buttons);
    }
  }
};

function drawButtons(list) {
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    var hover = game.mouse.x >= b.x && game.mouse.x <= b.x + b.w &&
                game.mouse.y >= b.y && game.mouse.y <= b.y + b.h;

    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 4;

    ctx.fillStyle = hover ? "#3c3c50" : "#232332";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.restore();

    ctx.strokeStyle = "#50505a"; ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 17px " + FONT_FAMILY;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.text, b.x + b.w/2, b.y + b.h/2);
  }
}

// ---------- ВВОД ----------
function posFromEvent(e) {
  var rect = canvas.getBoundingClientRect();
  var cx, cy;
  if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else if (e.changedTouches && e.changedTouches.length) {
    cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return { x: cx - rect.left, y: cy - rect.top };
}

function detectDragTarget(px, py) {
  var PAD_Y = 30;
  var PAD_X = 20;

  if (game.state === SETTINGS_SOUND) {
    if (window.__fxBar) {
      var fb = window.__fxBar;
      if (px >= fb.x - PAD_X && px <= fb.x + fb.w + PAD_X &&
          py >= fb.y - PAD_Y && py <= fb.y + fb.h + PAD_Y) return "fx";
    }
    if (window.__musicBar) {
      var mb = window.__musicBar;
      if (px >= mb.x - PAD_X && px <= mb.x + mb.w + PAD_X &&
          py >= mb.y - PAD_Y && py <= mb.y + mb.h + PAD_Y) return "music";
    }
  }

  if (game.state === SETTINGS_BG) {
    if (window.__pickerGrad) {
      var g = window.__pickerGrad;
      if (px >= g.x && px <= g.x + g.w && py >= g.y && py <= g.y + g.h) return "pickerGrad";
    }
    if (window.__pickerBar) {
      var bar = window.__pickerBar;
      if (px >= bar.x - 20 && px <= bar.x + bar.w + 20 &&
          py >= bar.y - 10 && py <= bar.y + bar.h + 10) return "pickerBar";
    }
    if (window.__pickerHue) {
      var hb = window.__pickerHue;
      if (px >= hb.x && px <= hb.x + hb.w &&
          py >= hb.y - 15 && py <= hb.y + hb.h + 15) return "pickerHue";
    }
  }

  if (game.state === SETTINGS_SQUARE) {
    if (window.__sqPickerGrad) {
      var sg = window.__sqPickerGrad;
      if (px >= sg.x && px <= sg.x + sg.w && py >= sg.y && py <= sg.y + sg.h) return "sqPickerGrad";
    }
    if (window.__sqPickerBar) {
      var sbar = window.__sqPickerBar;
      if (px >= sbar.x - 20 && px <= sbar.x + sbar.w + 20 &&
          py >= sbar.y - 10 && py <= sbar.y + sbar.h + 10) return "sqPickerBar";
    }
    if (window.__sqPickerHue) {
      var shb = window.__sqPickerHue;
      if (px >= shb.x && px <= shb.x + shb.w &&
          py >= shb.y - 15 && py <= shb.y + shb.h + 15) return "sqPickerHue";
    }
  }

  return null;
}

function xToVolume(x, barX, trackW) {
  var left = barX;
  var right = barX + trackW;
  if (x <= left) return 0;
  if (x >= right) return 1;
  return (x - left) / trackW;
}

function handleDrag(px, py) {
  if (dragging === "fx" && window.__fxBar) {
    var fb = window.__fxBar;
    fxVolume = xToVolume(px, fb.x, fb.w);
    try { localStorage.setItem("catchme_fxvol", fxVolume); } catch(e) {}
    return;
  }
  if (dragging === "music" && window.__musicBar) {
    var mb = window.__musicBar;
    musicVolume = xToVolume(px, mb.x, mb.w);
    try { localStorage.setItem("catchme_musicvol", musicVolume); } catch(e) {}
    if (musicVolume <= 0) stopMusic();
    else ensureMusicPlaying();
    return;
  }
  if (dragging === "pickerGrad" && window.__pickerGrad) {
    var g = window.__pickerGrad;
    picker.sat = Math.max(0, Math.min(1, (px - g.x) / g.w));
    picker.val = 1 - Math.max(0, Math.min(1, (py - g.y) / g.h));
    var rgb = hsvToRgb(picker.hue, picker.sat, picker.val);
    pickBgColor(rgbToHex(rgb[0], rgb[1], rgb[2]));
    return;
  }
  if (dragging === "pickerBar" && window.__pickerBar) {
    var bar = window.__pickerBar;
    picker.val = 1 - Math.max(0, Math.min(1, (py - bar.y) / bar.h));
    var rgb2 = hsvToRgb(picker.hue, picker.sat, picker.val);
    pickBgColor(rgbToHex(rgb2[0], rgb2[1], rgb2[2]));
    return;
  }
  if (dragging === "pickerHue" && window.__pickerHue) {
    var hb = window.__pickerHue;
    picker.hue = ((px - hb.x) / hb.w) * 360;
    if (picker.hue < 0) picker.hue = 0;
    if (picker.hue > 360) picker.hue = 360;
    var rgb3 = hsvToRgb(picker.hue, picker.sat, picker.val);
    pickBgColor(rgbToHex(rgb3[0], rgb3[1], rgb3[2]));
    return;
  }
  if (dragging === "sqPickerGrad" && window.__sqPickerGrad) {
    var sg = window.__sqPickerGrad;
    squarePicker.sat = Math.max(0, Math.min(1, (px - sg.x) / sg.w));
    squarePicker.val = 1 - Math.max(0, Math.min(1, (py - sg.y) / sg.h));
    var srgb = hsvToRgb(squarePicker.hue, squarePicker.sat, squarePicker.val);
    pickSquareColor(rgbToHex(srgb[0], srgb[1], srgb[2]));
    return;
  }
  if (dragging === "sqPickerBar" && window.__sqPickerBar) {
    var sbar = window.__sqPickerBar;
    squarePicker.val = 1 - Math.max(0, Math.min(1, (py - sbar.y) / sbar.h));
    var srgb2 = hsvToRgb(squarePicker.hue, squarePicker.sat, squarePicker.val);
    pickSquareColor(rgbToHex(srgb2[0], srgb2[1], srgb2[2]));
    return;
  }
  if (dragging === "sqPickerHue" && window.__sqPickerHue) {
    var shb = window.__sqPickerHue;
    squarePicker.hue = ((px - shb.x) / shb.w) * 360;
    if (squarePicker.hue < 0) squarePicker.hue = 0;
    if (squarePicker.hue > 360) squarePicker.hue = 360;
    var srgb3 = hsvToRgb(squarePicker.hue, squarePicker.sat, squarePicker.val);
    pickSquareColor(rgbToHex(srgb3[0], srgb3[1], srgb3[2]));
    return;
  }
}

canvas.addEventListener("mousemove", function(e) {
  var p = posFromEvent(e);
  game.mouse.x = p.x;
  game.mouse.y = p.y;
  if (dragging) handleDrag(p.x, p.y);
});

canvas.addEventListener("mousedown", function(e) {
  var p = posFromEvent(e);
  game.mouse.x = p.x; game.mouse.y = p.y;
  var target = detectDragTarget(p.x, p.y);
  if (target) {
    dragging = target;
    handleDrag(p.x, p.y);
    return;
  }
  game.click(p.x, p.y);
});

canvas.addEventListener("mouseup", function() { dragging = null; });
canvas.addEventListener("mouseleave", function() { dragging = null; });

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  var p = posFromEvent(e);
  game.mouse.x = p.x; game.mouse.y = p.y;
  var target = detectDragTarget(p.x, p.y);
  if (target) {
    dragging = target;
    handleDrag(p.x, p.y);
    return;
  }
  game.click(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", function(e) {
  e.preventDefault();
  var p = posFromEvent(e);
  game.mouse.x = p.x; game.mouse.y = p.y;
  if (dragging) handleDrag(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchend", function(e) {
  e.preventDefault();
  dragging = null;
}, { passive: false });

canvas.addEventListener("touchcancel", function(e) {
  dragging = null;
}, { passive: false });

// ---------- ЦИКЛ ----------
var lastTime = Date.now();
function loop() {
  var now = Date.now();
  var dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  game.update(dt);
  game.draw();
  requestAnimationFrame(loop);
}

// ---------- СТАРТ ----------
game.reset();
initBg();
initSqImage();
musicMode = "menu";
loop();
</script>
</body>
