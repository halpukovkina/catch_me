<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Поймай меня</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: Arial, sans-serif;
    user-select: none;
  }
  canvas { display: block; touch-action: none; }
  #fileInputBg, #fileInputSq { display: none; }
  #fileLabelBg, #fileLabelSq {
    position: fixed;
    display: none;
    z-index: 100;
    cursor: pointer;
  }
  #hexInput {
    position: fixed;
    display: none;
    z-index: 200;
    font-size: 22px;
    font-family: monospace;
    padding: 8px 12px;
    border: 2px solid #5050a0;
    border-radius: 8px;
    background: #1a1a2a;
    color: #f0f0f0;
    outline: none;
    width: 200px;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<input type="file" id="fileInputBg" accept="image/*">
<label for="fileInputBg" id="fileLabelBg"></label>

<input type="file" id="fileInputSq" accept="image/*">
<label for="fileInputSq" id="fileLabelSq"></label>

<input type="text" id="hexInput" maxlength="7" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="#000000">

<script>
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ---------- СОСТОЯНИЯ ----------
var MENU = "menu";
var PLAYING = "playing";
var GAME_OVER = "game_over";
var SETTINGS = "settings";
var SETTINGS_BG = "settings_bg";
var SETTINGS_SQUARE = "settings_square";
var SETTINGS_SOUND = "settings_sound";

var COLORS = ["#ff5050", "#50ff78", "#50a0ff", "#ffdc50", "#dc50ff", "#50fff0"];

var LEVELS = [
  { score: 0,  speed: 1.2, behavior: "run" },
  { score: 6,  speed: 1.6, behavior: "boost" },
  { score: 12, speed: 1.8, behavior: "disguise" },
  { score: 20, speed: 2.0, behavior: "teleport" },
  { score: 26, speed: 2.2, behavior: "multiply" },
  { score: 32, speed: 2.4, behavior: "hunt" }
];

var TELEPORT_RADIUS = 70;
var TELEPORT_COOLDOWN = 2.5;
var TELEPORT_MIN_DIST = 200;

var BOOST_INTERVAL = 2.0;
var BOOST_DURATION = 0.6;
var BOOST_MULTIPLIER = 2.0;

var SIZE_START = 50;
var SIZE_MIN = 14;
var SIZE_STEP = 2.5;

var exitButtonZone = null;

// ---------- ЗВУК ----------
var soundEnabled = true;
try {
  var savedSound = localStorage.getItem("catchme_sound");
  if (savedSound !== null) soundEnabled = (savedSound === "1");
} catch(e) {}

var fxVolume = 0.7;
try {
  var sv = localStorage.getItem("catchme_fxvol");
  if (sv !== null) fxVolume = parseFloat(sv);
} catch(e) {}

var musicVolume = 0.5;
try {
  var mv = localStorage.getItem("catchme_musicvol");
  if (mv !== null) musicVolume = parseFloat(mv);
} catch(e) {}

var audioCtx = null;
var audioReady = false;

function initAudio() {
  if (audioReady) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    audioReady = true;
  } catch(e) {}
}

function unlockAudio() {
  if (!audioReady) initAudio();
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume().catch(function(){});
  }
  // запускаем музыку при первом действии
  if (audioReady && soundEnabled && !musicPlaying) {
    startMusic();
  }
}

// ---- эффекты ----
function playTone(freq, duration, type, volumeScale, freqEnd, isMusic) {
  if (!soundEnabled) return;
  var vol = isMusic ? musicVolume : fxVolume;
  if (vol <= 0) return;
  if (!audioReady) initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") {
    audioCtx.resume().catch(function(){});
  }
  try {
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd !== undefined) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), now + duration);
    }
    var peak = vol * (volumeScale || 1) * 0.3;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  } catch(e) {}
}

function soundHit(score) {
  var baseFreq = 700 + Math.min(score * 40, 800);
  playTone(baseFreq, 0.08, "square", 0.8);
}
function soundGameOver() {
  playTone(500, 0.5, "sine", 0.9, 120);
}
function soundStart() {
  playTone(400, 0.15, "sine", 0.7, 800);
}
function soundClick() {
  playTone(900, 0.04, "square", 0.4);
}
function soundTeleport() {
  playTone(300, 0.12, "sine", 0.5, 1200);
}
function soundBoost() {
  playTone(1100, 0.06, "triangle", 0.5);
}

// ---- музыка ----
// простая мелодия в стиле пиксельных игр
var musicPlaying = false;
var musicTimer = null;
var musicStep = 0;

// ноты в Гц: C5, E5, G5, C6, G5, E5, D5, G5
var MELODY = [
  523.25, 659.25, 783.99, 1046.50,
  783.99, 659.25, 587.33, 783.99
];

// бас: C3, C3, A2, A2 — на каждые 2 ноты мелодии
var BASS = [
  130.81, 130.81, 110.00, 110.00
];

var MELODY_TEMPO = 320; // мс между нотами

function playMusicNote() {
  if (!soundEnabled || musicVolume <= 0 || !audioCtx) return;

  var now = audioCtx.currentTime;

  // мелодия
  var f = MELODY[musicStep % MELODY.length];
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(f, now);
    var peak = musicVolume * 0.08;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.28);
  } catch(e) {}

  // бас — каждые 2 шага
  if (musicStep % 2 === 0) {
    var bassF = BASS[Math.floor(musicStep / 2) % BASS.length];
    try {
      var osc2 = audioCtx.createOscillator();
      var gain2 = audioCtx.createGain();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(bassF, now);
      var peak2 = musicVolume * 0.12;
      gain2.gain.setValueAtTime(0.0001, now);
      gain2.gain.exponentialRampToValueAtTime(peak2, now + 0.01);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now);
      osc2.stop(now + 0.55);
    } catch(e) {}
  }

  musicStep++;
}

function startMusic() {
  if (musicPlaying) return;
  if (!audioReady) initAudio();
  if (!audioCtx) return;
  if (!soundEnabled || musicVolume <= 0) return;
  musicPlaying = true;
  playMusicNote();
  musicTimer = setInterval(playMusicNote, MELODY_TEMPO);
}

function stopMusic() {
  if (!musicPlaying) return;
  musicPlaying = false;
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

function restartMusic() {
  stopMusic();
  if (soundEnabled && musicVolume > 0 && audioReady) {
    startMusic();
  }
}

// ---------- ХРАНИЛИЩА ----------
var bgColor = null;
try { bgColor = localStorage.getItem("catchme_bgcolor") || null; } catch(e) {}

var squareColor = null;
try { squareColor = localStorage.getItem("catchme_squarecolor") || null; } catch(e) {}

function hsvToRgb(h, s, v) {
  var c = v * s;
  var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  var m = v - c;
  var r = 0, g = 0, b = 0;
  if (h < 60)       { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}

function rgbToHex(r, g, b) {
  function h(x) { var s = x.toString(16); return s.length === 1 ? "0" + s : s; }
  return "#" + h(r) + h(g) + h(b);
}

function hexToRgb(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  if (hex.length !== 6) return null;
  var num = parseInt(hex, 16);
  if (isNaN(num)) return null;
  return [(num>>16)&255, (num>>8)&255, num&255];
}

function initPickerFromColorObj(picker, hex) {
  if (!hex) return;
  var rgb = hexToRgb(hex);
  if (!rgb) return;
  var r = rgb[0]/255, g = rgb[1]/255, b = rgb[2]/255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var d = max - min, h = 0;
  if (d !== 0) {
    if (max === r) h = 60 * (((g-b)/d) % 6);
    else if (max === g) h = 60 * ((b-r)/d + 2);
    else h = 60 * ((r-g)/d + 4);
  }
  if (h < 0) h += 360;
  picker.hue = h;
  picker.sat = max === 0 ? 0 : d/max;
  picker.val = max;
}

var picker = { hue: 0, sat: 1, val: 1 };
initPickerFromColorObj(picker, bgColor);

var squarePicker = { hue: 0, sat: 1, val: 1 };
initPickerFromColorObj(squarePicker, squareColor);

// ---------- IndexedDB ----------
var bgImage = null, bgImageURL = null;
var sqImage = null, sqImageURL = null;

function openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open("catchme_db", 2);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains("bg")) db.createObjectStore("bg");
      if (!db.objectStoreNames.contains("square")) db.createObjectStore("square");
    };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}
function saveToStore(s, blob) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(s, "readwrite");
      tx.objectStore(s).put(blob, "image");
      tx.oncomplete = function() { res(); };
      tx.onerror = function(e) { rej(e.target.error); };
    });
  });
}
function loadFromStore(s) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(s, "readonly");
      var req = tx.objectStore(s).get("image");
      req.onsuccess = function() { res(req.result || null); };
      req.onerror = function(e) { rej(e.target.error); };
    });
  });
}
function deleteFromStore(s) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      var tx = db.transaction(s, "readwrite");
      tx.objectStore(s).delete("image");
      tx.oncomplete = function() { res(); };
      tx.onerror = function(e) { rej(e.target.error); };
    });
  });
}

function applyBgFromBlob(blob) {
  if (bgImageURL) { URL.revokeObjectURL(bgImageURL); bgImageURL = null; }
  bgImageURL = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function() { bgImage = img; };
  img.src = bgImageURL;
}
function applySqFromBlob(blob) {
  if (sqImageURL) { URL.revokeObjectURL(sqImageURL); sqImageURL = null; }
  sqImageURL = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function() { sqImage = img; };
  img.src = sqImageURL;
}
function initBg() {
  loadFromStore("bg").then(function(blob) {
    if (blob) applyBgFromBlob(blob);
  }).catch(function(e){});
}
function initSqImage() {
  loadFromStore("square").then(function(blob) {
    if (blob) applySqFromBlob(blob);
  }).catch(function(e){});
}

// ---------- ФАЙЛЫ ----------
var fileInputBg = document.getElementById("fileInputBg");
var fileLabelBg = document.getElementById("fileLabelBg");
var fileInputSq = document.getElementById("fileInputSq");
var fileLabelSq = document.getElementById("fileLabelSq");

fileInputBg.addEventListener("change", function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) { hideFileLabelBg(); return; }
  if (file.size > 15*1024*1024) {
    alert("Фото слишком большое. Выберите до 15 МБ.");
    fileInputBg.value = ""; hideFileLabelBg(); return;
  }
  bgColor = null;
  try { localStorage.removeItem("catchme_bgcolor"); } catch(err) {}
  saveToStore("bg", file).then(function() {
    applyBgFromBlob(file); hideFileLabelBg();
  }).catch(function(err) {
    alert("Не удалось сохранить фото."); hideFileLabelBg();
  });
  fileInputBg.value = "";
});

fileInputSq.addEventListener("change", function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) { hideFileLabelSq(); return; }
  if (file.size > 15*1024*1024) {
    alert("Фото слишком большое. Выберите до 15 МБ.");
    fileInputSq.value = ""; hideFileLabelSq(); return;
  }
  squareColor = null;
  try { localStorage.removeItem("catchme_squarecolor"); } catch(err) {}
  saveToStore("square", file).then(function() {
    applySqFromBlob(file); hideFileLabelSq();
  }).catch(function(err) {
    alert("Не удалось сохранить фото."); hideFileLabelSq();
  });
  fileInputSq.value = "";
});

function showFileLabelBg(x,y,w,h){ fileLabelBg.style.display="block"; fileLabelBg.style.left=x+"px"; fileLabelBg.style.top=y+"px"; fileLabelBg.style.width=w+"px"; fileLabelBg.style.height=h+"px"; }
function hideFileLabelBg(){ fileLabelBg.style.display="none"; }
function showFileLabelSq(x,y,w,h){ fileLabelSq.style.display="block"; fileLabelSq.style.left=x+"px"; fileLabelSq.style.top=y+"px"; fileLabelSq.style.width=w+"px"; fileLabelSq.style.height=h+"px"; }
function hideFileLabelSq(){ fileLabelSq.style.display="none"; }
function hideFileLabel(){ hideFileLabelBg(); hideFileLabelSq(); }

// ---------- HEX ----------
var hexInput = document.getElementById("hexInput");
var hexInputVisible = false;
var hexTarget = "bg";

function showHexInput(x,y,w,h,currentHex,target) {
  hexInput.style.display = "block";
  hexInput.style.left = x+"px"; hexInput.style.top = y+"px";
  hexInput.style.width = w+"px"; hexInput.style.height = h+"px";
  hexInput.value = currentHex || "#000000";
  hexInputVisible = true; hexTarget = target || "bg";
}
function hideHexInput() {
  hexInput.style.display = "none";
  hexInputVisible = false;
  hexInput.blur();
}
function applyHexInput() {
  var val = hexInput.value.trim();
  if (val.length > 0 && val[0] !== "#") val = "#" + val;
  var rgb = hexToRgb(val);
  if (rgb) {
    var hex = rgbToHex(rgb[0], rgb[1], rgb[2]);
    if (hexTarget === "square") {
      pickSquareColor(hex);
      initPickerFromColorObj(squarePicker, hex);
    } else {
      pickBgColor(hex);
      initPickerFromColorObj(picker, hex);
    }
  }
  hexTarget = "bg";
  hideHexInput();
}
hexInput.addEventListener("blur", function() {
  if (hexInputVisible) applyHexInput();
});
hexInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") { e.preventDefault(); applyHexInput(); }
});

function pickBgColor(hex) {
  bgColor = hex;
  try { localStorage.setItem("catchme_bgcolor", hex); } catch(e) {}
  if (bgImage) {
    deleteFromStore("bg").catch(function(){});
    if (bgImageURL) { URL.revokeObjectURL(bgImageURL); bgImageURL = null; }
    bgImage = null;
  }
}
function pickSquareColor(hex) {
  squareColor = hex;
  try { localStorage.setItem("catchme_squarecolor", hex); } catch(e) {}
  if (sqImage) {
    deleteFromStore("square").catch(function(){});
    if (sqImageURL) { URL.revokeObjectURL(sqImageURL); sqImageURL = null; }
    sqImage = null;
  }
}

function overlapsExitZone(x, y, size) {
  if (!exitButtonZone) return false;
  var half = size/2;
  var l = x-half, r = x+half, t = y-half, b = y+half;
  var eb = exitButtonZone;
  var pad = 8;
  return !(r < eb.x-pad || l > eb.x+eb.w+pad || b < eb.y-pad || t > eb.y+eb.h+pad);
}

// ---------- КВАДРАТИК ----------
function Square() {
  this.size = SIZE_START;
  this.x = Math.random() * (W - 100) + 50;
  this.y = Math.random() * (H - 100) + 50;
  this.color = squareColor || COLORS[Math.floor(Math.random() * COLORS.length)];
  this.speed = 2.0;
  this.behavior = "run";
  this.huntTimer = 0;
  this.fake = false;
  this.teleportCooldown = 0;
  this.boostTimer = BOOST_INTERVAL;
  this.boostActive = 0;
  this.disguiseTimer = 60;
}

Square.prototype.update = function(mx, my, score, dt) {
  if (!dt) dt = 1/60;

  var current = LEVELS[0];
  for (var i = 0; i < LEVELS.length; i++) {
    if (score >= LEVELS[i].score) current = LEVELS[i];
  }
  this.speed = current.speed;
  this.behavior = this.fake ? "run" : current.behavior;

  if (!this.fake) {
    this.size = Math.max(SIZE_MIN, SIZE_START - score * SIZE_STEP);
  }

  if (this.teleportCooldown > 0) this.teleportCooldown -= dt;

  var boostFactor = 1.0;
  if (this.behavior === "boost") {
    this.boostTimer -= dt;
    if (this.boostTimer <= 0 && this.boostActive <= 0) {
      this.boostActive = BOOST_DURATION;
      this.boostTimer = BOOST_INTERVAL;
      if (!this.fake) soundBoost();
    }
    if (this.boostActive > 0) {
      this.boostActive -= dt;
      boostFactor = BOOST_MULTIPLIER;
    }
  }

  var dx = this.x - mx;
  var dy = this.y - my;
  var dist = Math.sqrt(dx*dx + dy*dy) || 1;
  dx /= dist; dy /= dist;

  var moveX = 0, moveY = 0;

  if (this.behavior === "run" || this.behavior === "boost" ||
      this.behavior === "disguise" || this.behavior === "multiply" ||
      this.behavior === "teleport") {
    moveX = dx * this.speed * boostFactor;
    moveY = dy * this.speed * boostFactor;

    if (this.behavior === "teleport" &&
        this.teleportCooldown <= 0 &&
        dist < TELEPORT_RADIUS) {
      var newX, newY, attempts = 0;
      do {
        newX = Math.random() * (W - 100) + 50;
        newY = Math.random() * (H - 100) + 50;
        attempts++;
      } while (
        attempts < 20 &&
        (Math.sqrt((newX-mx)*(newX-mx)+(newY-my)*(newY-my)) < TELEPORT_MIN_DIST ||
         overlapsExitZone(newX, newY, this.size))
      );
      this.x = newX; this.y = newY;
      this.teleportCooldown = TELEPORT_COOLDOWN;
      if (!this.fake) soundTeleport();
      return;
    }

    if (this.behavior === "disguise") {
      this.disguiseTimer--;
      if (this.disguiseTimer <= 0) {
        if (!squareColor && !sqImage) {
          this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }
        this.disguiseTimer = 60;
      }
    }
  } else if (this.behavior === "hunt") {
    this.huntTimer--;
    if (this.huntTimer <= 0) {
      moveX = -dx * this.speed * 1.5;
      moveY = -dy * this.speed * 1.5;
      this.huntTimer = 90;
    } else {
      moveX = dx * this.speed * 0.5;
      moveY = dy * this.speed * 0.5;
    }
  }

  var newX = this.x + moveX;
  var newY = this.y + moveY;

  if (overlapsExitZone(newX, newY, this.size)) {
    if (!overlapsExitZone(newX, this.y, this.size)) { newY = this.y; }
    else if (!overlapsExitZone(this.x, newY, this.size)) { newX = this.x; }
    else { newX = this.x; newY = this.y; }
  }

  this.x = newX; this.y = newY;
  this.x = Math.max(this.size, Math.min(W - this.size, this.x));
  this.y = Math.max(this.size, Math.min(H - this.size, this.y));
};

Square.prototype.draw = function() {
  if (sqImage && !this.fake) {
    ctx.drawImage(sqImage, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
  } else {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
  }
};

Square.prototype.collides = function(mx, my) {
  return Math.abs(mx - this.x) < this.size/2 && Math.abs(my - this.y) < this.size/2;
};

// ---------- ВСПЛЫВАШКИ «+1» ----------
var popups = [];

function spawnPopup(x, y) {
  popups.push({
    x: x,
    y: y,
    life: 0.8,
    maxLife: 0.8
  });
}

function updatePopups(dt) {
  for (var i = popups.length - 1; i >= 0; i--) {
    var p = popups[i];
    p.y -= 60 * dt;
    p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

function drawPopups() {
  for (var i = 0; i < popups.length; i++) {
    var p = popups[i];
    var alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("+1", p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// ---------- ИГРА ----------
var game = {
  state: MENU,
  mode: "timed",
  score: 0,
  timeLeft: 30,
  record: 0,
  square: null,
  fakeSquares: [],
  mouse: { x: 200, y: 200 },
  buttons: [],

  reset: function() {
    this.square = new Square();
    this.fakeSquares = [];
    this.score = 0;
    this.timeLeft = 30;
    popups = [];
  },

  start: function(mode) {
    this.reset();
    this.mode = mode;
    this.state = PLAYING;
    hideFileLabel();
    hideHexInput();
    unlockAudio();
    soundStart();
  },

  end: function() {
    this.state = GAME_OVER;
    if (this.score > this.record) {
      this.record = this.score;
      try { localStorage.setItem("catchme_record", this.record); } catch(e) {}
    }
    soundGameOver();
    stopMusic();
  },

  update: function(dt) {
    updatePopups(dt);

    if (this.state !== PLAYING) return;
    var mx = this.mouse.x, my = this.mouse.y;
    this.square.update(mx, my, this.score, dt);

    if (this.square.behavior === "multiply" && this.fakeSquares.length < 2) {
      if (Math.random() < 0.015) {
        var fs = new Square();
        fs.fake = true;
        this.fakeSquares.push(fs);
      }
    }
    for (var i = 0; i < this.fakeSquares.length; i++) {
      this.fakeSquares[i].update(mx, my, this.score, dt);
    }

    if (this.mode === "timed") {
      this.timeLeft -= dt;
      if (this.timeLeft <= 0) { this.timeLeft = 0; this.end(); }
    }
  },

  click: function(px, py) {
    unlockAudio();

    if (this.state === MENU) {
      for (var i = 0; i < this.buttons.length; i++) {
        var b = this.buttons[i];
        if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
          soundClick();
          if (b.id === "timed") this.start("timed");
          if (b.id === "endless") this.start("endless");
          if (b.id === "settings") this.state = SETTINGS;
          return;
        }
      }
      return;
    }

    if (this.state === SETTINGS) {
      for (var k = 0; k < this.buttons.length; k++) {
        var sb = this.buttons[k];
        if (px >= sb.x && px <= sb.x + sb.w && py >= sb.y && py <= sb.y + sb.h) {
          soundClick();
          if (sb.id === "bg") this.state = SETTINGS_BG;
          if (sb.id === "square") this.state = SETTINGS_SQUARE;
          if (sb.id === "sound") this.state = SETTINGS_SOUND;
          if (sb.id === "back") this.state = MENU;
          return;
        }
      }
      return;
    }

    if (this.state === SETTINGS_BG) {
      if (window.__pickerGrad) {
        var g = window.__pickerGrad;
        if (px >= g.x && px <= g.x + g.w && py >= g.y && py <= g.y + g.h) {
          picker.sat = Math.max(0, Math.min(1, (px - g.x) / g.w));
          picker.val = 1 - Math.max(0, Math.min(1, (py - g.y) / g.h));
          var rgb = hsvToRgb(picker.hue, picker.sat, picker.val);
          pickBgColor(rgbToHex(rgb[0], rgb[1], rgb[2]));
          return;
        }
      }
      if (window.__pickerBar) {
        var bar = window.__pickerBar;
        if (px >= bar.x && px <= bar.x + bar.w && py >= bar.y && py <= bar.y + bar.h) {
          picker.val = 1 - Math.max(0, Math.min(1, (py - bar.y) / bar.h));
          var rgb2 = hsvToRgb(picker.hue, picker.sat, picker.val);
          pickBgColor(rgbToHex(rgb2[0], rgb2[1], rgb2[2]));
          return;
        }
      }
      if (window.__pickerHue) {
        var hb = window.__pickerHue;
        if (px >= hb.x && px <= hb.x + hb.w && py >= hb.y && py <= hb.y + hb.h) {
          picker.hue = ((px - hb.x) / hb.w) * 360;
          if (picker.hue < 0) picker.hue = 0;
          if (picker.hue > 360) picker.hue = 360;
          var rgb3 = hsvToRgb(picker.hue, picker.sat, picker.val);
          pickBgColor(rgbToHex(rgb3[0], rgb3[1], rgb3[2]));
          return;
        }
      }
      for (var m = 0; m < this.buttons.length; m++) {
        var bb = this.buttons[m];
        if (px >= bb.x && px <= bb.x + bb.w && py >= bb.y && py <= bb.y + bb.h) {
          soundClick();
          if (bb.id === "back") { hideHexInput(); this.state = SETTINGS; return; }
          if (bb.id === "hex") {
            showHexInput(bb.x, bb.y, bb.w, bb.h, bgColor || "#000000", "bg");
            hexInput.focus(); hexInput.select(); return;
          }
        }
      }
      return;
    }

    if (this.state === SETTINGS_SQUARE) {
      if (window.__sqPickerGrad) {
        var sg = window.__sqPickerGrad;
        if (px >= sg.x && px <= sg.x + sg.w && py >= sg.y && py <= sg.y + sg.h) {
          squarePicker.sat = Math.max(0, Math.min(1, (px - sg.x) / sg.w));
          squarePicker.val = 1 - Math.max(0, Math.min(1, (py - sg.y) / sg.h));
          var srgb = hsvToRgb(squarePicker.hue, squarePicker.sat, squarePicker.val);
          pickSquareColor(rgbToHex(srgb[0], srgb[1], srgb[2]));
          return;
        }
      }
      if (window.__sqPickerBar) {
        var sbar = window.__sqPickerBar;
        if (px >= sbar.x && px <= sbar.x + sbar.w && py >= sbar.y && py <= sbar.y + sbar.h) {
          squarePicker.val = 1 - Math.max(0, Math.min(1, (py - sbar.y) / sbar.h));
          var srgb2 = hsvToRgb(squarePicker.hue, squarePicker.sat, squarePicker.val);
          pickSquareColor(rgbToHex(srgb2[0], srgb2[1], srgb2[2]));
          return;
        }
      }
      if (window.__sqPickerHue) {
        var shb = window.__sqPickerHue;
        if (px >= shb.x && px <= shb.x + shb.w && py >= shb.y && py <= shb.y + shb.h) {
          squarePicker.hue = ((px - shb.x) / shb.w) * 360;
          if (squarePicker.hue < 0) squarePicker.hue = 0;
          if (squarePicker.hue > 360) squarePicker.hue = 360;
          var srgb3 = hsvToRgb(squarePicker.hue, squarePicker.sat, squarePicker.val);
          pickSquareColor(rgbToHex(srgb3[0], srgb3[1], srgb3[2]));
          return;
        }
      }
      for (var sm = 0; sm < this.buttons.length; sm++) {
        var sbb = this.buttons[sm];
        if (px >= sbb.x && px <= sbb.x + sbb.w && py >= sbb.y && py <= sbb.y + sbb.h) {
          soundClick();
          if (sbb.id === "back") { hideHexInput(); this.state = SETTINGS; return; }
          if (sbb.id === "hex") {
            showHexInput(sbb.x, sbb.y, sbb.w, sbb.h, squareColor || "#ff5050", "square");
            hexInput.focus(); hexInput.select(); return;
          }
        }
      }
      return;
    }

    if (this.state === SETTINGS_SOUND) {
      // кнопки
      for (var q = 0; q < this.buttons.length; q++) {
        var qb = this.buttons[q];
        if (px >= qb.x && px <= qb.x + qb.w && py >= qb.y && py <= qb.y + qb.h) {
          soundClick();
          if (qb.id === "toggle") {
            soundEnabled = !soundEnabled;
            try { localStorage.setItem("catchme_sound", soundEnabled ? "1" : "0"); } catch(e) {}
            if (soundEnabled) { startMusic(); }
            else { stopMusic(); }
            return;
          }
          if (qb.id === "test") {
            playTone(880, 0.15, "square", 0.8);
            return;
          }
          if (qb.id === "back") { this.state = SETTINGS; return; }
        }
      }
      // ползунок эффектов
      if (window.__fxBar) {
        var fb = window.__fxBar;
        if (px >= fb.x && px <= fb.x + fb.w && py >= fb.y && py <= fb.y + fb.h) {
          fxVolume = 1 - Math.max(0, Math.min(1, (py - fb.y) / fb.h));
          try { localStorage.setItem("catchme_fxvol", fxVolume); } catch(e) {}
          playTone(700, 0.06, "square", 0.6);
          return;
        }
      }
      // ползунок музыки
      if (window.__musicBar) {
        var mb = window.__musicBar;
        if (px >= mb.x && px <= mb.x + mb.w && py >= mb.y && py <= mb.y + mb.h) {
          musicVolume = 1 - Math.max(0, Math.min(1, (py - mb.y) / mb.h));
          try { localStorage.setItem("catchme_musicvol", musicVolume); } catch(e) {}
          return;
        }
      }
      return;
    }

    if (this.state === PLAYING) {
      if (window.__exitButton) {
        var eb = window.__exitButton;
        if (px >= eb.x && px <= eb.x + eb.w && py >= eb.y && py <= eb.y + eb.h) {
          soundClick();
          this.state = MENU;
          if (soundEnabled) startMusic();
          return;
        }
      }
      if (this.square.collides(px, py)) {
        this.score++;
        spawnPopup(px, py);
        soundHit(this.score);
        var newX, newY, attempts = 0;
        do {
          newX = Math.random() * (W - 100) + 50;
          newY = Math.random() * (H - 100) + 50;
          attempts++;
        } while (
          attempts < 20 &&
          (Math.sqrt((newX-px)*(newX-px)+(newY-py)*(newY-py)) < 150 ||
           overlapsExitZone(newX, newY, this.square.size))
        );
        this.square.x = newX;
        this.square.y = newY;
        this.square.color = squareColor || COLORS[Math.floor(Math.random() * COLORS.length)];
        this.fakeSquares = [];
      }
      // промахи убраны — в бесконечном тоже ничего не делаем
      return;
    }

    if (this.state === GAME_OVER) {
      for (var j = 0; j < this.buttons.length; j++) {
        var b2 = this.buttons[j];
        if (px >= b2.x && px <= b2.x + b2.w && py >= b2.y && py <= b2.y + b2.h) {
          soundClick();
          if (b2.id === "again") this.start(this.mode);
          if (b2.id === "menu") {
            this.state = MENU;
            if (soundEnabled && musicVolume > 0) startMusic();
          }
          return;
        }
      }
    }
  },

  draw: function() {
    if (bgImage) {
      var imgRatio = bgImage.width / bgImage.height;
      var screenRatio = W / H;
      var dw, dh, dx, dy;
      if (imgRatio > screenRatio) {
        dh = H; dw = H * imgRatio; dx = (W - dw) / 2; dy = 0;
      } else {
        dw = W; dh = W / imgRatio; dx = 0; dy = (H - dh) / 2;
      }
      ctx.drawImage(bgImage, dx, dy, dw, dh);
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillRect(0, 0, W, H);
    } else if (bgColor) {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.fillStyle = "#0a0a0f";
      ctx.fillRect(0, 0, W, H);
    }

    if (this.state === MENU) this.drawMenu();
    else if (this.state === PLAYING) this.drawPlaying();
    else if (this.state === GAME_OVER) this.drawGameOver();
    else if (this.state === SETTINGS) this.drawSettings();
    else if (this.state === SETTINGS_BG) this.drawSettingsBg();
    else if (this.state === SETTINGS_SQUARE) this.drawSettingsSquare();
    else if (this.state === SETTINGS_SOUND) this.drawSettingsSound();
  },

  drawMenu: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 52px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ПОЙМАЙ МЕНЯ", W / 2, H * 0.22);

    ctx.fillStyle = "#808090";
    ctx.font = "20px Arial";
    ctx.fillText("Рекорд: " + this.record, W / 2, H * 0.32);

    var bw = Math.min(320, W - 60);
    var bx = (W - bw) / 2;

    var b1 = { x: bx, y: H * 0.42, w: bw, h: 60, text: "На время (30 сек)", id: "timed" };
    var b2 = { x: bx, y: H * 0.42 + 75, w: bw, h: 60, text: "Бесконечный", id: "endless" };
    var b3 = { x: bx, y: H * 0.42 + 150, w: bw, h: 60, text: "Настройки", id: "settings" };
    this.buttons = [b1, b2, b3];
    drawButtons(this.buttons);
  },

  drawSettings: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 44px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("НАСТРОЙКИ", W / 2, H * 0.14);

    var bw = Math.min(320, W - 60);
    var bx = (W - bw) / 2;

    var bBg = { x: bx, y: H * 0.28, w: bw, h: 55, text: "Фон", id: "bg" };
    var bSq = { x: bx, y: H * 0.28 + 70, w: bw, h: 55, text: "Квадратик", id: "square" };
    var bSnd = { x: bx, y: H * 0.28 + 140, w: bw, h: 55, text: "Звук", id: "sound" };
    var bBack = { x: bx, y: H * 0.28 + 240, w: bw, h: 55, text: "Назад", id: "back" };
    this.buttons = [bBg, bSq, bSnd, bBack];
    drawButtons(this.buttons);
  },

  drawSettingsBg: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabelSq();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 36px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ФОН", W / 2, H * 0.06);

    var gradW = Math.min(W - 140, 400);
    var gradH = Math.min(H * 0.28, 200);
    var gradX = (W - gradW) / 2 - 20;
    var gradY = H * 0.11;

    if (!window.__gradCanvasCache ||
        window.__gradCanvasCache.width !== gradW ||
        window.__gradCanvasCache.height !== gradH ||
        window.__gradHue !== picker.hue) {
      window.__gradCanvasCache = document.createElement("canvas");
      window.__gradCanvasCache.width = gradW;
      window.__gradCanvasCache.height = gradH;
      var gctx = window.__gradCanvasCache.getContext("2d");
      var img = gctx.createImageData(gradW, gradH);
      var data = img.data;
      for (var yy = 0; yy < gradH; yy++) {
        for (var xx = 0; xx < gradW; xx++) {
          var s = xx / gradW;
          var v = 1 - yy / gradH;
          var rgb = hsvToRgb(picker.hue, s, v);
          var idx = (yy * gradW + xx) * 4;
          data[idx] = rgb[0]; data[idx+1] = rgb[1];
          data[idx+2] = rgb[2]; data[idx+3] = 255;
        }
      }
      gctx.putImageData(img, 0, 0);
    }
    window.__gradHue = picker.hue;
    ctx.drawImage(window.__gradCanvasCache, gradX, gradY, gradW, gradH);

    ctx.strokeStyle = "#606070";
    ctx.lineWidth = 2;
    ctx.strokeRect(gradX, gradY, gradW, gradH);

    var markX = gradX + picker.sat * gradW;
    var markY = gradY + (1 - picker.val) * gradH;
    ctx.beginPath(); ctx.arc(markX, markY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(markX, markY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 1; ctx.stroke();

    window.__pickerGrad = { x: gradX, y: gradY, w: gradW, h: gradH };

    var barW = 40, barH = gradH;
    var barX = gradX + gradW + 20, barY = gradY;

    var grad = ctx.createLinearGradient(0, barY, 0, barY + barH);
    var topRgb = hsvToRgb(picker.hue, picker.sat, 1);
    grad.addColorStop(0, "rgb(" + topRgb[0] + "," + topRgb[1] + "," + topRgb[2] + ")");
    grad.addColorStop(1, "#000000");
    ctx.fillStyle = grad;
    ctx.fillRect(barX, barY, barW, barH);

    ctx.strokeStyle = "#606070"; ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);

    var valY = barY + (1 - picker.val) * barH;
    ctx.beginPath();
    ctx.moveTo(barX-6, valY); ctx.lineTo(barX, valY-6);
    ctx.lineTo(barX+barW+6, valY-6); ctx.lineTo(barX+barW, valY);
    ctx.lineTo(barX+barW+6, valY+6); ctx.lineTo(barX, valY+6);
    ctx.closePath();
    ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.5; ctx.stroke();

    window.__pickerBar = { x: barX, y: barY, w: barW, h: barH };

    var hueW = gradW + 20 + barW, hueH = 24;
    var hueX = gradX, hueY = gradY + gradH + 14;

    var hueGrad = ctx.createLinearGradient(hueX, 0, hueX + hueW, 0);
    hueGrad.addColorStop(0.000, "#ff0000");
    hueGrad.addColorStop(0.167, "#ffff00");
    hueGrad.addColorStop(0.333, "#00ff00");
    hueGrad.addColorStop(0.500, "#00ffff");
    hueGrad.addColorStop(0.667, "#0000ff");
    hueGrad.addColorStop(0.833, "#ff00ff");
    hueGrad.addColorStop(1.000, "#ff0000");
    ctx.fillStyle = hueGrad;
    ctx.fillRect(hueX, hueY, hueW, hueH);

    ctx.strokeStyle = "#606070"; ctx.lineWidth = 2;
    ctx.strokeRect(hueX, hueY, hueW, hueH);

    var hueMarkX = hueX + (picker.hue/360) * hueW;
    ctx.beginPath(); ctx.arc(hueMarkX, hueY + hueH/2, 10, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; ctx.stroke();

    window.__pickerHue = { x: hueX, y: hueY, w: hueW, h: hueH };

    var btnW = Math.min(W - 80, 260);
    var btnX = (W - btnW) / 2;
    var btnY = hueY + hueH + 24;

    var bHex = { x: btnX, y: btnY, w: btnW, h: 50,
                 text: "Ввести HEX: " + (bgColor || "#000000"), id: "hex" };
    var bUp = { x: btnX, y: btnY + 62, w: btnW, h: 55,
                text: "Загрузить фото", id: "upload" };
    var bBack = { x: btnX, y: btnY + 127, w: btnW, h: 55,
                  text: "Назад", id: "back" };

    this.buttons = [bHex, bUp, bBack];
    drawButtons(this.buttons);
    showFileLabelBg(bUp.x, bUp.y, bUp.w, bUp.h);
  },

  drawSettingsSquare: function() {
    exitButtonZone = null;

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 32px Arial";

    if (!window.__sqGradCache ||

      for (var yy2 = 0; yy2 < gradH; yy2++) {
        for (var xx2 = 0; xx2 < gradW; xx2++) {
          var s2 = xx2 / gradW;
          var v2 = 1 - yy2 / gradH;
          var rgb2 = hsvToRgb(squarePicker.hue, s2, v2);
          var idx2 = (yy2 * gradW + xx2) * 4;
          data2[idx2] = rgb2[0]; data2[idx2+1] = rgb2[1];
          data2[idx2+2] = rgb2[2]; data2[idx2+3] = 255;
        }
      }
      gctx2.putImageData(img2, 0, 0);
    }
    window.__sqGradHue = squarePicker.hue;
    ctx.drawImage(window.__sqGradCache, gradX, gradY, gradW, gradH);

    ctx.strokeStyle = "#606070"; ctx.lineWidth = 2;
    ctx.strokeRect(gradX, gradY, gradW, gradH);

    var smarkX = gradX + squarePicker.sat * gradW;
    var smarkY = gradY + (1 - squarePicker.val) * gradH;
    ctx.beginPath(); ctx.arc(smarkX, smarkY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(smarkX, smarkY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 1; ctx.stroke();

    window.__sqPickerGrad = { x: gradX, y: gradY, w: gradW, h: gradH };

    var sbarW = 40, sbarH = gradH;
    var sbarX = gradX + gradW + 20, sbarY = gradY;

    var sgrad = ctx.createLinearGradient(0, sbarY, 0, sbarY + sbarH);
    var stopRgb = hsvToRgb(squarePicker.hue, squarePicker.sat, 1);
    sgrad.addColorStop(0, "rgb(" + stopRgb[0] + "," + stopRgb[1] + "," + stopRgb[2] + ")");
    sgrad.addColorStop(1, "#000000");
    ctx.fillStyle = sgrad;
    ctx.fillRect(sbarX, sbarY, sbarW, sbarH);
    ctx.strokeStyle = "#606070"; ctx.lineWidth = 2;
    ctx.strokeRect(sbarX, sbarY, sbarW, sbarH);

    var svalY = sbarY + (1 - squarePicker.val) * sbarH;
    ctx.beginPath();
    ctx.moveTo(sbarX-6, svalY); ctx.lineTo(sbarX, svalY-6);
    ctx.lineTo(sbarX+sbarW+6, svalY-6); ctx.lineTo(sbarX+sbarW, svalY);
    ctx.lineTo(sbarX+sbarW+6, svalY+6); ctx.lineTo(sbarX, svalY+6);
    ctx.closePath();
    ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.5; ctx.stroke();

    window.__sqPickerBar = { x: sbarX, y: sbarY, w: sbarW, h: sbarH };

    var shueW = gradW + 20 + sbarW, shueH = 22;
    var shueX = gradX, shueY = gradY + gradH + 12;

    var shueGrad = ctx.createLinearGradient(shueX, 0, shueX + shueW, 0);
    shueGrad.addColorStop(0.000, "#ff0000");
    shueGrad.addColorStop(0.167, "#ffff00");
    shueGrad.addColorStop(0.333, "#00ff00");
    shueGrad.addColorStop(0.500, "#00ffff");
    shueGrad.addColorStop(0.667, "#0000ff");
    shueGrad.addColorStop(0.833, "#ff00ff");
    shueGrad.addColorStop(1.000, "#ff0000");
    ctx.fillStyle = shueGrad;
    ctx.fillRect(shueX, shueY, shueW, shueH);
    ctx.strokeStyle = "#606070"; ctx.lineWidth = 2;
    ctx.strokeRect(shueX, shueY, shueW, shueH);

    var shueMarkX = shueX + (squarePicker.hue/360) * shueW;
    ctx.beginPath(); ctx.arc(shueMarkX, shueY + shueH/2, 9, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; ctx.stroke();

    window.__sqPickerHue = { x: shueX, y: shueY, w: shueW, h: shueH };

    var sbtnW = Math.min(W - 80, 260);
    var sbtnX = (W - sbtnW) / 2;
    var sbtnY = shueY + shueH + 18;

    var sbHex = { x: sbtnX, y: sbtnY, w: sbtnW, h: 50,
                  text: "Ввести HEX: " + (squareColor || "#ff5050"), id: "hex" };
    var sbUp = { x: sbtnX, y: sbtnY + 62, w: sbtnW, h: 55,
                 text: "Загрузить фото", id: "upload" };
    var sbBack = { x: sbtnX, y: sbtnY + 127, w: sbtnW, h: 55,
                   text: "Назад", id: "back" };

    this.buttons = [sbHex, sbUp, sbBack];
    drawButtons(this.buttons);
    showFileLabelSq(sbUp.x, sbUp.y, sbUp.w, sbUp.h);
  },

  drawSettingsSound: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 40px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ЗВУК", W / 2, H * 0.10);

    var bw = Math.min(320, W - 60);
    var bx = (W - bw) / 2;

    // кнопка вкл/выкл
    var bToggle = {
      x: bx, y: H * 0.22, w: bw, h: 60,
      text: soundEnabled ? "Звук: ВКЛ" : "Звук: ВЫКЛ",
      id: "toggle"
    };
    this.buttons = [bToggle];
    drawButtons(this.buttons);

    // ползунок эффектов
    var barY = H * 0.42;
    var barH = 60;
    var barW = bw;

    ctx.fillStyle = "#c0c0d0";
    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText("Громкость эффектов: " + Math.round(fxVolume * 100) + "%", W / 2, barY - 8);

    // фон полоски
    ctx.fillStyle = "#1a1a2a";
    ctx.fillRect(bx, barY, barW, 30);
    ctx.strokeStyle = "#50505a";
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, barY, barW, 30);

    // заполнение
    ctx.fillStyle = "#50a0ff";
    ctx.fillRect(bx, barY, barW * fxVolume, 30);

    // ползунок
    var knobX = bx + barW * fxVolume;
    ctx.beginPath();
    ctx.arc(knobX, barY + 15, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;
    ctx.stroke();

    window.__fxBar = { x: bx, y: barY, w: barW, h: 30 };

    // ползунок музыки
    var mbarY = H * 0.58;

    ctx.fillStyle = "#c0c0d0";
    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText("Громкость музыки: " + Math.round(musicVolume * 100) + "%", W / 2, mbarY - 8);

    ctx.fillStyle = "#1a1a2a";
    ctx.fillRect(bx, mbarY, barW, 30);
    ctx.strokeStyle = "#50505a";
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, mbarY, barW, 30);

    ctx.fillStyle = "#50ff78";
    ctx.fillRect(bx, mbarY, barW * musicVolume, 30);

    var mknobX = bx + barW * musicVolume;
    ctx.beginPath();
    ctx.arc(mknobX, mbarY + 15, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;
    ctx.stroke();

    window.__musicBar = { x: bx, y: mbarY, w: barW, h: 30 };

    // кнопки
    var bTest = { x: bx, y: H * 0.72, w: bw, h: 55, text: "Проверить звук", id: "test" };
    var bBack = { x: bx, y: H * 0.72 + 70, w: bw, h: 55, text: "Назад", id: "back" };

    this.buttons = [bToggle, bTest, bBack];
    drawButtons(this.buttons);
  },

  drawPlaying: function() {
    hideFileLabel();
    hideHexInput();

    var exitSize = 48;
    var exitX = W - exitSize - 16;
    var exitY = 16;
    exitButtonZone = { x: exitX, y: exitY, w: exitSize, h: exitSize };

    for (var i = 0; i < this.fakeSquares.length; i++) this.fakeSquares[i].draw();
    this.square.draw();

    // всплывашки
    drawPopups();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("Очки: " + this.score, 20, 20);

    ctx.font = "20px Arial";
    if (this.mode === "timed") {
      ctx.fillText("Время: " + Math.ceil(this.timeLeft), 20, 52);
    } else {
      ctx.fillText("Бесконечный", 20, 52);
    }

    var hover = game.mouse.x >= exitX && game.mouse.x <= exitX + exitSize &&
                game.mouse.y >= exitY && game.mouse.y <= exitY + exitSize;

    ctx.fillStyle = hover ? "#3c3c50" : "#232332";
    ctx.fillRect(exitX, exitY, exitSize, exitSize);
    ctx.strokeStyle = "#50505a"; ctx.lineWidth = 2;
    ctx.strokeRect(exitX, exitY, exitSize, exitSize);

    ctx.strokeStyle = "#f0f0f0";
    ctx.lineWidth = 3;
    var pad = 14;
    ctx.beginPath();
    ctx.moveTo(exitX+pad, exitY+pad);
    ctx.lineTo(exitX+exitSize-pad, exitY+exitSize-pad);
    ctx.moveTo(exitX+exitSize-pad, exitY+pad);
    ctx.lineTo(exitX+pad, exitY+exitSize-pad);
    ctx.stroke();

    window.__exitButton = { x: exitX, y: exitY, w: exitSize, h: exitSize };
  },

  drawGameOver: function() {
    exitButtonZone = null;
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 48px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Игра окончена", W / 2, H * 0.22);

    ctx.font = "28px Arial";
    ctx.fillText("Твой счёт: " + this.score, W / 2, H * 0.36);

    ctx.fillStyle = "#808090";
    ctx.font = "22px Arial";
    ctx.fillText("Рекорд: " + this.record, W / 2, H * 0.44);

    var msg;
    if (this.score >= 20) msg = "Ты его поймал. Но он вернётся.";
    else if (this.score >= 10) msg = "Хорошо. Но он ещё быстрее.";
    else msg = "Он всё ещё быстрее тебя.";
    ctx.fillStyle = "#f0f0f0";
    ctx.font = "20px Arial";
    ctx.fillText(msg, W / 2, H * 0.53);

    var bw = Math.min(320, W - 60);
    var bx = (W - bw) / 2;
    var half = (bw - 20) / 2;

    var b1 = { x: bx, y: H * 0.68, w: half, h: 55, text: "Ещё раз", id: "again" };
    var b2 = { x: bx + half + 20, y: H * 0.68, w: half, h: 55, text: "В меню", id: "menu" };
    this.buttons = [b1, b2];
    drawButtons(this.buttons);
  }
};

function drawButtons(list) {
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    var hover = game.mouse.x >= b.x && game.mouse.x <= b.x + b.w &&
                game.mouse.y >= b.y && game.mouse.y <= b.y + b.h;
    ctx.fillStyle = hover ? "#3c3c50" : "#232332";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = "#50505a";
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.text, b.x + b.w/2, b.y + b.h/2);
  }
}

// ---------- ВВОД ----------
function posFromEvent(e) {
  var rect = canvas.getBoundingClientRect();
  var cx, cy;
  if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else if (e.changedTouches && e.changedTouches.length) {
    cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return { x: cx - rect.left, y: cy - rect.top };
}

canvas.addEventListener("mousemove", function(e) {
  var p = posFromEvent(e);
  game.mouse.x = p.x; game.mouse.y = p.y;
});

canvas.addEventListener("click", function(e) {
  var p = posFromEvent(e);
  game.click(p.x, p.y);
});

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  var p = posFromEvent(e);
  game.mouse.x = p.x; game.mouse.y = p.y;
  game.click(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", function(e) {
  e.preventDefault();
  var p = posFromEvent(e);
  game.mouse.x = p.x; game.mouse.y = p.y;
}, { passive: false });

// ---------- ЦИКЛ ----------
var lastTime = Date.now();
function loop() {
  var now = Date.now();
  var dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  game.update(dt);
  game.draw();
  requestAnimationFrame(loop);
}

// ---------- СТАРТ ----------
try {
  game.record = parseInt(localStorage.getItem("catchme_record") || "0");
} catch(e) { game.record = 0; }

game.reset();
initBg();
initSqImage();
loop();

// первая попытка запустить музыку (если браузер разрешит — заиграет сразу)
window.addEventListener("load", function() {
  // не запускаем сразу — браузер не даст.
  // музыка стартует при первом клике через unlockAudio()
});
</script>
