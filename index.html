<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Поймай меня</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: Arial, sans-serif;
    user-select: none;
  }
  canvas { display: block; touch-action: none; }
  #fileInput { display: none; }
  #fileLabel {
    position: fixed;
    display: none;
    z-index: 100;
    cursor: pointer;
  }
  /* Скрытый input для HEX-кода */
  #hexInput {
    position: fixed;
    display: none;
    z-index: 200;
    font-size: 22px;
    font-family: monospace;
    padding: 8px 12px;
    border: 2px solid #5050a0;
    border-radius: 8px;
    background: #1a1a2a;
    color: #f0f0f0;
    outline: none;
    width: 200px;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Скрытые элементы -->
<input type="file" id="fileInput" accept="image/*">
<label for="fileInput" id="fileLabel"></label>
<input type="text" id="hexInput" maxlength="7" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="#000000">

<script>
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ---------- СОСТОЯНИЯ ----------
var MENU = "menu";
var PLAYING = "playing";
var GAME_OVER = "game_over";
var SETTINGS = "settings";
var SETTINGS_BG = "settings_bg";

// ---------- ЦВЕТА КВАДРАТИКА ----------
var COLORS = ["#ff5050", "#50ff78", "#50a0ff", "#ffdc50", "#dc50ff", "#50fff0"];

// ---------- ПРОГРЕССИЯ ----------
var LEVELS = [
  { score: 0,  speed: 1.2, behavior: "run" },
  { score: 3,  speed: 1.6, behavior: "dash" },
  { score: 6,  speed: 2.0, behavior: "teleport" },
  { score: 9,  speed: 2.4, behavior: "disguise" },
  { score: 12, speed: 2.8, behavior: "multiply" },
  { score: 15, speed: 3.2, behavior: "hunt" }
];

// ---------- ХРАНИЛИЩЕ ЦВЕТА ФОНА ----------
var bgColor = null;
try { bgColor = localStorage.getItem("catchme_bgcolor") || null; } catch(e) {}

// ---------- HSV КОНВЕРТАЦИЯ ----------
function hsvToRgb(h, s, v) {
  var c = v * s;
  var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  var m = v - c;
  var r = 0, g = 0, b = 0;
  if (h < 60)       { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function rgbToHex(r, g, b) {
  function h(x) { var s = x.toString(16); return s.length === 1 ? "0" + s : s; }
  return "#" + h(r) + h(g) + h(b);
}

function hexToRgb(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) {
    hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
  }
  if (hex.length !== 6) return null;
  var num = parseInt(hex, 16);
  if (isNaN(num)) return null;
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}

// ---------- СОСТОЯНИЕ ПИКЕРА ----------
var picker = {
  hue: 0,          // 0..360
  sat: 1,          // 0..1
  val: 1,          // 0..1
  dragging: false  // тянет ли пользователь по градиенту
};

// если есть сохранённый цвет — попробуем инициализировать пикер по нему
function initPickerFromColor(hex) {
  if (!hex) return;
  var rgb = hexToRgb(hex);
  if (!rgb) return;
  var r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
  var max = Math.max(r, g, b), min = Math.min(r, g, b);
  var d = max - min;
  var h = 0;
  if (d !== 0) {
    if (max === r) h = 60 * (((g - b) / d) % 6);
    else if (max === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
  }
  if (h < 0) h += 360;
  picker.hue = h;
  picker.sat = max === 0 ? 0 : d / max;
  picker.val = max;
}
initPickerFromColor(bgColor);

// ---------- ХРАНИЛИЩЕ ФОТО (IndexedDB) ----------
var bgImage = null;
var bgImageURL = null;

function openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open("catchme_db", 1);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains("bg")) {
        db.createObjectStore("bg");
      }
    };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function saveBg(blob) {
  return openDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction("bg", "readwrite");
      tx.objectStore("bg").put(blob, "image");
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function(e) { reject(e.target.error); };
    });
  });
}

function loadBg() {
  return openDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction("bg", "readonly");
      var req = tx.objectStore("bg").get("image");
      req.onsuccess = function() { resolve(req.result || null); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  });
}

function deleteBg() {
  return openDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction("bg", "readwrite");
      tx.objectStore("bg").delete("image");
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function(e) { reject(e.target.error); };
    });
  });
}

function applyBgFromBlob(blob) {
  if (bgImageURL) {
    URL.revokeObjectURL(bgImageURL);
    bgImageURL = null;
  }
  bgImageURL = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function() { bgImage = img; };
  img.src = bgImageURL;
}

function initBg() {
  loadBg().then(function(blob) {
    if (blob) applyBgFromBlob(blob);
  }).catch(function(e) {
    console.log("Не удалось загрузить фон:", e);
  });
}

// ---------- ОБРАБОТКА ФАЙЛА ----------
var fileInput = document.getElementById("fileInput");
var fileLabel = document.getElementById("fileLabel");

fileInput.addEventListener("change", function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) { hideFileLabel(); return; }
  if (file.size > 15 * 1024 * 1024) {
    alert("Фото слишком большое. Выберите до 15 МБ.");
    fileInput.value = "";
    hideFileLabel();
    return;
  }

  // сбрасываем цвет
  bgColor = null;
  try { localStorage.removeItem("catchme_bgcolor"); } catch(err) {}

  saveBg(file).then(function() {
    applyBgFromBlob(file);
    hideFileLabel();
  }).catch(function(err) {
    console.log("Не удалось сохранить фон:", err);
    alert("Не удалось сохранить фото.");
    hideFileLabel();
  });

  fileInput.value = "";
});

function showFileLabel(x, y, w, h) {
  fileLabel.style.display = "block";
  fileLabel.style.left = x + "px";
  fileLabel.style.top = y + "px";
  fileLabel.style.width = w + "px";
  fileLabel.style.height = h + "px";
}

function hideFileLabel() {
  fileLabel.style.display = "none";
}

// ---------- ОБРАБОТКА HEX ----------
var hexInput = document.getElementById("hexInput");
var hexInputVisible = false;

function showHexInput(x, y, w, h, currentHex) {
  hexInput.style.display = "block";
  hexInput.style.left = x + "px";
  hexInput.style.top = y + "px";
  hexInput.style.width = w + "px";
  hexInput.style.height = h + "px";
  hexInput.value = currentHex || "#000000";
  hexInputVisible = true;
}

function hideHexInput() {
  hexInput.style.display = "none";
  hexInputVisible = false;
  hexInput.blur();
}

// Enter или потеря фокуса — применяем
function applyHexInput() {
  var val = hexInput.value.trim();
  if (val.length > 0 && val[0] !== "#") val = "#" + val;
  var rgb = hexToRgb(val);
  if (rgb) {
    pickBgColor(rgbToHex(rgb[0], rgb[1], rgb[2]));
    initPickerFromColor(bgColor);
  }
  hideHexInput();
}

hexInput.addEventListener("blur", function() {
  if (hexInputVisible) applyHexInput();
});

hexInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    applyHexInput();
  }
});

// ---------- ПРИМЕНЕНИЕ ЦВЕТА ----------
function pickBgColor(hex) {
  bgColor = hex;
  try { localStorage.setItem("catchme_bgcolor", hex); } catch(e) {}

  if (bgImage) {
    deleteBg().catch(function(){});
    if (bgImageURL) {
      URL.revokeObjectURL(bgImageURL);
      bgImageURL = null;
    }
    bgImage = null;
  }
}

// ---------- КВАДРАТИК ----------
function Square() {
  this.size = 30;
  this.x = Math.random() * (W - 100) + 50;
  this.y = Math.random() * (H - 100) + 50;
  this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
  this.speed = 2.0;
  this.behavior = "run";
  this.dashTimer = 0;
  this.dashDx = 0;
  this.dashDy = 0;
  this.disguiseTimer = 0;
  this.huntTimer = 0;
  this.fake = false;
}

Square.prototype.update = function(mx, my, score) {
  var current = LEVELS[0];
  for (var i = 0; i < LEVELS.length; i++) {
    if (score >= LEVELS[i].score) current = LEVELS[i];
  }
  this.speed = current.speed;
  this.behavior = this.fake ? "run" : current.behavior;

  var dx = this.x - mx;
  var dy = this.y - my;
  var dist = Math.sqrt(dx * dx + dy * dy) || 1;
  dx /= dist; dy /= dist;

  if (this.behavior === "run") {
    this.x += dx * this.speed;
    this.y += dy * this.speed;
  } else if (this.behavior === "dash") {
    this.dashTimer--;
    if (this.dashTimer <= 0) {
      var angle = Math.random() * Math.PI * 2;
      this.dashDx = Math.cos(angle);
      this.dashDy = Math.sin(angle);
      this.dashTimer = 20 + Math.random() * 20;
    }
    this.x += dx * this.speed * 0.5 + this.dashDx * 4;
    this.y += dy * this.speed * 0.5 + this.dashDy * 4;
  } else if (this.behavior === "teleport") {
    if (dist < 120) {
      this.x = Math.random() * (W - 100) + 50;
      this.y = Math.random() * (H - 100) + 50;
    } else {
      this.x += dx * this.speed * 0.6;
      this.y += dy * this.speed * 0.6;
    }
  } else if (this.behavior === "disguise") {
    this.disguiseTimer--;
    if (this.disguiseTimer <= 0) {
      this.size = [20, 30, 45][Math.floor(Math.random() * 3)];
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.disguiseTimer = 60;
    }
    this.x += dx * this.speed;
    this.y += dy * this.speed;
  } else if (this.behavior === "multiply") {
    this.x += dx * this.speed;
    this.y += dy * this.speed;
  } else if (this.behavior === "hunt") {
    this.huntTimer--;
    if (this.huntTimer <= 0) {
      this.x -= dx * this.speed * 1.5;
      this.y -= dy * this.speed * 1.5;
      this.huntTimer = 90;
    } else {
      this.x += dx * this.speed * 0.5;
      this.y += dy * this.speed * 0.5;
    }
  }

  this.x = Math.max(this.size, Math.min(W - this.size, this.x));
  this.y = Math.max(this.size, Math.min(H - this.size, this.y));
};

Square.prototype.draw = function() {
  ctx.fillStyle = this.color;
  ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
};

Square.prototype.collides = function(mx, my) {
  return Math.abs(mx - this.x) < this.size / 2 && Math.abs(my - this.y) < this.size / 2;
};

// ---------- ИГРА ----------
var game = {
  state: MENU,
  mode: "timed",
  score: 0,
  misses: 0,
  timeLeft: 30,
  record: 0,
  square: null,
  fakeSquares: [],
  mouse: { x: 200, y: 200 },
  buttons: [],

  reset: function() {
    this.square = new Square();
    this.fakeSquares = [];
    this.score = 0;
    this.misses = 0;
    this.timeLeft = 30;
  },

  start: function(mode) {
    this.reset();
    this.mode = mode;
    this.state = PLAYING;
    hideFileLabel();
    hideHexInput();
  },

  end: function() {
    this.state = GAME_OVER;
    if (this.score > this.record) {
      this.record = this.score;
      try { localStorage.setItem("catchme_record", this.record); } catch(e) {}
    }
  },

  update: function(dt) {
    if (this.state !== PLAYING) return;
    var mx = this.mouse.x, my = this.mouse.y;
    this.square.update(mx, my, this.score);

    if (this.square.behavior === "multiply" && this.fakeSquares.length < 2) {
      if (Math.random() < 0.015) {
        var fs = new Square();
        fs.fake = true;
        this.fakeSquares.push(fs);
      }
    }
    for (var i = 0; i < this.fakeSquares.length; i++) {
      this.fakeSquares[i].update(mx, my, this.score);
    }

    if (this.mode === "timed") {
      this.timeLeft -= dt;
      if (this.timeLeft <= 0) { this.timeLeft = 0; this.end(); }
    }
  },

  click: function(px, py) {
    if (this.state === MENU) {
      for (var i = 0; i < this.buttons.length; i++) {
        var b = this.buttons[i];
        if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
          if (b.id === "timed") this.start("timed");
          if (b.id === "endless") this.start("endless");
          if (b.id === "settings") { this.state = SETTINGS; }
          return;
        }
      }
      return;
    }

    if (this.state === SETTINGS) {
      for (var k = 0; k < this.buttons.length; k++) {
        var sb = this.buttons[k];
        if (px >= sb.x && px <= sb.x + sb.w && py >= sb.y && py <= sb.y + sb.h) {
          if (sb.id === "bg") { this.state = SETTINGS_BG; return; }
          if (sb.id === "back") { this.state = MENU; return; }
        }
      }
      return;
    }

    if (this.state === SETTINGS_BG) {
      // проверка градиента
      if (window.__pickerGrad) {
        var g = window.__pickerGrad;
        if (px >= g.x && px <= g.x + g.w && py >= g.y && py <= g.y + g.h) {
          picker.sat = Math.max(0, Math.min(1, (px - g.x) / g.w));
          picker.val = 1 - Math.max(0, Math.min(1, (py - g.y) / g.h));
          var rgb = hsvToRgb(picker.hue, picker.sat, picker.val);
          pickBgColor(rgbToHex(rgb[0], rgb[1], rgb[2]));
          return;
        }
      }
      // проверка ползунка яркости
      if (window.__pickerBar) {
        var bar = window.__pickerBar;
        if (px >= bar.x && px <= bar.x + bar.w && py >= bar.y && py <= bar.y + bar.h) {
          picker.val = 1 - Math.max(0, Math.min(1, (py - bar.y) / bar.h));
          var rgb2 = hsvToRgb(picker.hue, picker.sat, picker.val);
          pickBgColor(rgbToHex(rgb2[0], rgb2[1], rgb2[2]));
          return;
        }
      }
      // проверка кнопок
      for (var m = 0; m < this.buttons.length; m++) {
        var bb = this.buttons[m];
        if (px >= bb.x && px <= bb.x + bb.w && py >= bb.y && py <= bb.y + bb.h) {
          if (bb.id === "back") {
            hideHexInput();
            this.state = SETTINGS;
            return;
          }
          if (bb.id === "hex") {
            var hexBtn = bb;
            showHexInput(hexBtn.x, hexBtn.y, hexBtn.w, hexBtn.h, bgColor || "#000000");
            hexInput.focus();
            hexInput.select();
            return;
          }
          // upload — через label, не здесь
        }
      }
      return;
    }

    if (this.state === PLAYING) {
      if (this.square.collides(px, py)) {
        this.score++;
        this.square.x = Math.random() * (W - 100) + 50;
        this.square.y = Math.random() * (H - 100) + 50;
        this.square.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.fakeSquares = [];
      } else if (this.mode === "endless") {
        this.misses++;
        if (this.misses >= 3) this.end();
      }
      return;
    }

    if (this.state === GAME_OVER) {
      for (var j = 0; j < this.buttons.length; j++) {
        var b2 = this.buttons[j];
        if (px >= b2.x && px <= b2.x + b2.w && py >= b2.y && py <= b2.y + b2.h) {
          if (b2.id === "again") this.start(this.mode);
          if (b2.id === "menu") this.state = MENU;
          return;
        }
      }
    }
  },

  draw: function() {
    // ---- ФОН ----
    if (bgImage) {
      var imgRatio = bgImage.width / bgImage.height;
      var screenRatio = W / H;
      var dw, dh, dx, dy;
      if (imgRatio > screenRatio) {
        dh = H; dw = H * imgRatio; dx = (W - dw) / 2; dy = 0;
      } else {
        dw = W; dh = W / imgRatio; dx = 0; dy = (H - dh) / 2;
      }
      ctx.drawImage(bgImage, dx, dy, dw, dh);
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillRect(0, 0, W, H);
    } else if (bgColor) {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.fillStyle = "#0a0a0f";
      ctx.fillRect(0, 0, W, H);
    }

    if (this.state === MENU) this.drawMenu();
    else if (this.state === PLAYING) this.drawPlaying();
    else if (this.state === GAME_OVER) this.drawGameOver();
    else if (this.state === SETTINGS) this.drawSettings();
    else if (this.state === SETTINGS_BG) this.drawSettingsBg();
  },

  drawMenu: function() {
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 52px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ПОЙМАЙ МЕНЯ", W / 2, H * 0.22);

    ctx.fillStyle = "#808090";
    ctx.font = "20px Arial";
    ctx.fillText("Рекорд: " + this.record, W / 2, H * 0.32);

    var bw = Math.min(320, W - 60);
    var bx = (W - bw) / 2;

    var b1 = { x: bx, y: H * 0.42, w: bw, h: 60, text: "На время (30 сек)", id: "timed" };
    var b2 = { x: bx, y: H * 0.42 + 75, w: bw, h: 60, text: "Бесконечный", id: "endless" };
    var b3 = { x: bx, y: H * 0.42 + 150, w: bw, h: 60, text: "Настройки", id: "settings" };
    this.buttons = [b1, b2, b3];
    drawButtons(this.buttons);
  },

  // ---- ЭКРАН НАСТРОЕК (главное меню настроек) ----
  drawSettings: function() {
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 44px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("НАСТРОЙКИ", W / 2, H * 0.20);

    var bw = Math.min(320, W - 60);
    var bx = (W - bw) / 2;

    var bBg = { x: bx, y: H * 0.35, w: bw, h: 60, text: "Фон", id: "bg" };
    // здесь позже можно добавить: Звук, Сложность, Управление
    var bBack = { x: bx, y: H * 0.35 + 200, w: bw, h: 60, text: "Назад", id: "back" };
    this.buttons = [bBg, bBack];
    drawButtons(this.buttons);
  },

  // ---- ЭКРАН НАСТРОЙКИ ФОНА ----
  drawSettingsBg: function() {
    this.buttons = [];
    hideFileLabel();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 36px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("ФОН", W / 2, H * 0.06);

    // ---------- ГРАДИЕНТ HSV ----------
    // Рисуем пиксель за пикселем — используем offscreen canvas для скорости
    var gradW = Math.min(W - 140, 400);
    var gradH = Math.min(H * 0.30, 220);
    var gradX = (W - gradW) / 2 - 20;
    var gradY = H * 0.12;

    if (!window.__gradCanvasCache || window.__gradCanvasCache.width !== gradW || window.__gradCanvasCache.height !== gradH) {
      window.__gradCanvasCache = document.createElement("canvas");
      window.__gradCanvasCache.width = gradW;
      window.__gradCanvasCache.height = gradH;
      var gctx = window.__gradCanvasCache.getContext("2d");
      var img = gctx.createImageData(gradW, gradH);
      var data = img.data;
      for (var yy = 0; yy < gradH; yy++) {
        for (var xx = 0; xx < gradW; xx++) {
          var s = xx / gradW;
          var v = 1 - yy / gradH;
          var rgb = hsvToRgb(picker.hue, s, v);
          var idx = (yy * gradW + xx) * 4;
          data[idx] = rgb[0];
          data[idx + 1] = rgb[1];
          data[idx + 2] = rgb[2];
          data[idx + 3] = 255;
        }
      }
      gctx.putImageData(img, 0, 0);
    }
    ctx.drawImage(window.__gradCanvasCache, gradX, gradY, gradW, gradH);

    // рамка
    ctx.strokeStyle = "#606070";
    ctx.lineWidth = 2;
    ctx.strokeRect(gradX, gradY, gradW, gradH);

    // маркер выбранного цвета на градиенте
    var markX = gradX + picker.sat * gradW;
    var markY = gradY + (1 - picker.val) * gradH;
    ctx.beginPath();
    ctx.arc(markX, markY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(markX, markY, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    ctx.stroke();

    window.__pickerGrad = { x: gradX, y: gradY, w: gradW, h: gradH };

    // ---------- ПОЛЗУНОК ЯРКОСТИ ----------
    var barW = 40;
    var barH = gradH;
    var barX = gradX + gradW + 20;
    var barY = gradY;

    // градиент яркости — от чёрного к полному цвету
    var grad = ctx.createLinearGradient(0, barY, 0, barY + barH);
    var topRgb = hsvToRgb(picker.hue, picker.sat, 1);
    grad.addColorStop(0, "rgb(" + topRgb[0] + "," + topRgb[1] + "," + topRgb[2] + ")");
    grad.addColorStop(1, "#000000");
    ctx.fillStyle = grad;
    ctx.fillRect(barX, barY, barW, barH);

    ctx.strokeStyle = "#606070";
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);

    // маркер яркости
    var valY = barY + (1 - picker.val) * barH;
    ctx.beginPath();
    ctx.moveTo(barX - 6, valY);
    ctx.lineTo(barX, valY - 6);
    ctx.lineTo(barX + barW + 6, valY - 6);
    ctx.lineTo(barX + barW, valY);
    ctx.lineTo(barX + barW + 6, valY + 6);
    ctx.lineTo(barX, valY + 6);
    ctx.closePath();
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    window.__pickerBar = { x: barX, y: barY, w: barW, h: barH };

    // ---------- ПРЕВЬЮ ТЕКУЩЕГО ЦВЕТА ----------
    var previewSize = 50;
    var previewX = 20;
    var previewY = gradY;
    ctx.fillStyle = bgColor || "#000000";
    ctx.fillRect(previewX, previewY, previewSize, previewSize);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.strokeRect(previewX, previewY, previewSize, previewSize);

    // ---------- ПОЛЕ HEX + КНОПКА ----------
    var hexBtnW = Math.min(W - 80, 260);
    var hexBtnH = 50;
    var hexBtnX = (W - hexBtnW) / 2;
    var hexBtnY = gradY + gradH + 20;

    var bHex = { x: hexBtnX, y: hexBtnY, w: hexBtnW, h: hexBtnH,
                 text: "Ввести HEX: " + (bgColor || "#000000"), id: "hex" };

    // ---------- КНОПКА ФОТО ----------
    var bUp = { x: hexBtnX, y: hexBtnY + 65, w: hexBtnW, h: 55,
                text: "Загрузить фото", id: "upload" };

    // ---------- КНОПКА НАЗАД ----------
    var bBack = { x: hexBtnX, y: hexBtnY + 130, w: hexBtnW, h: 55,
                  text: "Назад", id: "back" };

    this.buttons = [bHex, bUp, bBack];
    drawButtons(this.buttons);

    // невидимый label поверх кнопки "Загрузить фото"
    showFileLabel(bUp.x, bUp.y, bUp.w, bUp.h);
  },

  drawPlaying: function() {
    hideFileLabel();
    hideHexInput();

    for (var i = 0; i < this.fakeSquares.length; i++) this.fakeSquares[i].draw();
    this.square.draw();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 26px Arial";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("Очки: " + this.score, 20, 20);

    ctx.textAlign = "right";
    if (this.mode === "timed") {
      ctx.fillText("Время: " + Math.ceil(this.timeLeft), W - 20, 20);
    } else {
      ctx.fillText("Промахи: " + this.misses + "/3", W - 20, 20);
    }
  },

  drawGameOver: function() {
    this.buttons = [];
    hideFileLabel();
    hideHexInput();

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 48px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Игра окончена", W / 2, H * 0.22);

    ctx.font = "28px Arial";
    ctx.fillText("Твой счёт: " + this.score, W / 2, H * 0.36);

    ctx.fillStyle = "#808090";
    ctx.font = "22px Arial";
    ctx.fillText("Рекорд: " + this.record, W / 2, H * 0.44);

    var msg;
    if (this.score >= 15) msg = "Ты его поймал. Но он вернётся.";
    else if (this.score >= 8) msg = "Хорошо. Но он ещё быстрее.";
    else msg = "Он всё ещё быстрее тебя.";
    ctx.fillStyle = "#f0f0f0";
    ctx.font = "20px Arial";
    ctx.fillText(msg, W / 2, H * 0.53);

    var bw = Math.min(320, W - 60);
    var bx = (W - bw) / 2;
    var half = (bw - 20) / 2;

    var b1 = { x: bx, y: H * 0.68, w: half, h: 55, text: "Ещё раз", id: "again" };
    var b2 = { x: bx + half + 20, y: H * 0.68, w: half, h: 55, text: "В меню", id: "menu" };
    this.buttons = [b1, b2];
    drawButtons(this.buttons);
  }
};

function drawButtons(list) {
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    var hover = game.mouse.x >= b.x && game.mouse.x <= b.x + b.w &&
                game.mouse.y >= b.y && game.mouse.y <= b.y + b.h;
    ctx.fillStyle = hover ? "#3c3c50" : "#232332";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = "#50505a";
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    ctx.fillStyle = "#f0f0f0";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.text, b.x + b.w / 2, b.y + b.h / 2);
  }
}

// ---------- ВВОД ----------
function posFromEvent(e) {
  var rect = canvas.getBoundingClientRect();
  var cx, cy;
  if (e.touches && e.touches.length) {
    cx = e.touches[0].clientX;
    cy = e.touches[0].clientY;
  } else if (e.changedTouches && e.changedTouches.length) {
    cx = e.changedTouches[0].clientX;
    cy = e.changedTouches[0].clientY;
  } else {
    cx = e.clientX;
    cy = e.clientY;
  }
  return { x: cx - rect.left, y: cy - rect.top };
}

canvas.addEventListener("mousemove", function(e) {
  var p = posFromEvent(e);
  game.mouse.x = p.x;
  game.mouse.y = p.y;
});

canvas.addEventListener("click", function(e) {
  var p = posFromEvent(e);
  game.click(p.x, p.y);
});

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  var p = posFromEvent(e);
  game.mouse.x = p.x;
  game.mouse.y = p.y;
  game.click(p.x, p.y);
}, { passive: false });

canvas.addEventListener("touchmove", function(e) {
  e.preventDefault();
  var p = posFromEvent(e);
  game.mouse.x = p.x;
  game.mouse.y = p.y;
}, { passive: false });

// ---------- ЦИКЛ ----------
var lastTime = Date.now();
function loop() {
  var now = Date.now();
  var dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  game.update(dt);
  game.draw();
  requestAnimationFrame(loop);
}

// ---------- СТАРТ ----------
try {
  game.record = parseInt(localStorage.getItem("catchme_record") || "0");
} catch(e) { game.record = 0; }

game.reset();
initBg();
loop();
</script>
